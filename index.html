  function handlePdfFile(file){
    pendingFile = file;
    renderPhotoArea(true);

    loadPdfJs().then(function(pdfjsLib){
      return file.arrayBuffer().then(function(buf){
        return pdfjsLib.getDocument({ data: buf }).promise;
      });
    }).then(function(pdf){
      var numPages = Math.min(pdf.numPages, MAX_PDF_PAGES);
      var thumbs = [];
      var blobs = [];
      // Keep the local preview thumbnails small and fast to generate/display;
      // shrink the per-page quality budget as page count grows instead of
      // using the single-photo budget per page. (The full-quality page
      // blobs used for AI extraction and permanent Drive storage are kept
      // separately, at higher quality — see the toBlob call below.)
      var perPageBudget = Math.max(40000, Math.floor(220000 / numPages));
      var chain = Promise.resolve();
      var _loop = function(pageNum){
        chain = chain.then(function(){ return pdf.getPage(pageNum); }).then(function(page){
          var viewport = page.getViewport({ scale: 1.5 });
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(viewport.width));
          canvas.height = Math.max(1, Math.round(viewport.height));
          var ctx = canvas.getContext('2d');
          return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function(){
            thumbs.push(thumbnailDataUrlFromCanvas(canvas, 1000, 0.72, perPageBudget));
            return new Promise(function(res){
              canvas.toBlob(function(b){ if(b) blobs.push(b); res(); }, 'image/jpeg', 0.85);
            });
          });
        });
      };
      for(var i=1;i<=numPages;i++){ _loop(i); }
      return chain.then(function(){
        if(!thumbs.length) throw new Error('no pages rendered');
        pendingThumbs = thumbs;
        pendingThumb = thumbs[0];
        pendingAiBlobs = blobs;
        if(pdf.numPages > MAX_PDF_PAGES){
          showToast('PDFを読み込みました（全'+pdf.numPages+'ページ中、先頭'+MAX_PDF_PAGES+'ページを使用します）');
        }
      });
    }).then(function(){
      renderPhotoArea();
      renderAiArea();
    }).catch(function(){
      showToast('PDFを読み込めませんでした。写真として撮影し直すか、別のファイルをお試しください。');
      resetPending();
      renderPhotoArea();
    });
  }

  function fillField(id, val){ var el = document.getElementById(id); if(el && val) el.value = val; }

  function runAiExtract(){
    if(!pendingAiBlobs || !pendingAiBlobs.length){ showToast('画像の準備中です。少し待ってからもう一度お試しください。'); return; }
    var btn = document.getElementById('aiExtractBtn');
    var area = document.getElementById('aiArea');
    btn.disabled = true;
    area.insertAdjacentHTML('beforeend','<div class="ai-status" id="aiStatus"><span class="spinner"></span>文書を読み取っています…</div>');

    aiAbort = new AbortController();
    var signal = aiAbort.signal;

    Promise.all(pendingAiBlobs.map(function(b){
      return blobToBase64(b).then(function(base64){ return { base64: base64, mimeType: b.type || 'image/jpeg' }; });
    })).then(function(images){
      // 30s, not the usual 15s, because Gemini's own vision-model latency on
      // a multi-page document can comfortably exceed the 15s cap used for
      // the much lighter toggle/delete requests.
      return withTimeout(apiPost('aiExtract', { images: images }, { signal: signal }), 30000);
    }).then(function(resp){
      var status = document.getElementById('aiStatus'); if(status && status.parentNode) status.parentNode.removeChild(status);
      if(!resp || resp.ok !== true){
        aiDisabledForSession = true;
        area.insertAdjacentHTML('beforeend','<div class="ai-note warn">この端末ではAI自動読み取りを利用できません。手入力してください。</div>');
        return;
      }
      var dat = resp.data || {};
      var names = Array.isArray(dat.productNames) ? dat.productNames.filter(Boolean) : [];
      if(names.length) fillField('f_products', names.join('、'));
      if(dat.issueDate && /^\d{4}-\d{2}-\d{2}$/.test(dat.issueDate)) fillField('f_date', dat.issueDate);
      if(dat.documentType) fillField('f_type', dat.documentType);
      if(dat.documentNumber) fillField('f_docnum', dat.documentNumber);
      if(dat.issuer) fillField('f_issuer', dat.issuer);
      if(dat.summary) fillField('f_summary', dat.summary);
      var msg = names.length ? 'AIが読み取りました。内容を確認して保存してください。' : 'AIが読み取りましたが、商品名を特定できませんでした。手入力してください。';
      area.insertAdjacentHTML('beforeend','<div class="ai-note '+(names.length?'ok':'warn')+'">'+escapeHtml(msg)+'</div>');
    }).catch(function(err){
      var status = document.getElementById('aiStatus'); if(status && status.parentNode) status.parentNode.removeChild(status);
      if(err && err.name === 'AbortError') return; // modal was closed mid-request; don't disable AI just for that
      aiDisabledForSession = true;
      area.insertAdjacentHTML('beforeend','<div class="ai-note warn">この端末ではAI自動読み取りを利用できません。手入力してください。</div>');
    }).finally(function(){
      if(btn) btn.disabled = false;
      aiAbort = null;
    });
  }

  function wireModal(){
    renderPhotoArea();
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('cancelModal').addEventListener('click', closeModal);
    document.getElementById('overlay').addEventListener('click', function(e){ if(e.target.id==='overlay') closeModal(); });
    document.getElementById('saveModal').addEventListener('click', function(){
      var productsRaw = document.getElementById('f_products').value.trim();
      if(!productsRaw){ showToast('商品名を入力してください。'); return; }
      var products = productsRaw.split(/[、,\n]/).map(function(s){return s.trim();}).filter(Boolean);
      var data = {
        location: document.getElementById('f_location').value || null,
        productNames: products,
        issueDate: document.getElementById('f_date').value || null,
        documentType: document.getElementById('f_type').value.trim() || null,
        documentNumber: document.getElementById('f_docnum').value.trim() || null,
        issuer: document.getElementById('f_issuer').value.trim() || null,
        summary: document.getElementById('f_summary').value.trim() || null,
        fileName: pendingFile ? pendingFile.name : null
      };

      var saveBtn = document.getElementById('saveModal');
      var dupWarning = document.getElementById('dupWarning');

      if(!duplicateAcknowledged){
        var dup = findLikelyDuplicate(data);
        if(dup){
          dupWarning.innerHTML = '<div class="ai-note warn">類似の文書がすでに登録されています（'+
            escapeHtml(fmtDate(dup.issueDate))+(dup.documentNumber?' ・ '+escapeHtml(dup.documentNumber):'')+
            (dup.productNames&&dup.productNames.length?' ・ '+escapeHtml(dup.productNames.join('、')):'')+
            '）。重複登録の可能性があります。内容を確認し、問題なければもう一度「保存する」を押してください。</div>';
          duplicateAcknowledged = true; // next click proceeds even if still a match
          saveBtn.textContent = '確認のうえ保存する';
          dupWarning.scrollIntoView({behavior:'smooth', block:'nearest'});
          return;
        }
      }

      dupWarning.innerHTML = '';
      saveBtn.disabled = true; saveBtn.textContent='保存中…';

      var localThumbs = (pendingThumbs && pendingThumbs.length) ? pendingThumbs.slice() : (pendingThumb ? [pendingThumb] : []);
      var imagesPromise = (pendingAiBlobs && pendingAiBlobs.length)
        ? Promise.all(pendingAiBlobs.map(function(b){
            return blobToBase64(b).then(function(base64){ return { base64: base64, mimeType: b.type || 'image/jpeg' }; });
          }))
        : Promise.resolve([]);

      imagesPromise.then(function(images){
        var payload = {
          documentNumber: data.documentNumber,
          documentType: data.documentType,
          issueDate: data.issueDate,
          issuer: data.issuer,
          productNames: data.productNames,
          summary: data.summary,
          fileName: data.fileName,
          location: data.location,
          images: images
        };
        return addDocument(payload, localThumbs);
      }).then(function(){
        showToast('文書を登録しました。');
        closeModal();
      }).catch(function(){
        showToast('保存に失敗しました。もう一度お試しください。');
        saveBtn.disabled = false; saveBtn.textContent='保存する';
      });
    });
  }

  // ---------------- Init ----------------
  loadLocationPrefs();
  render(); // paint immediately with an empty/loading state — never block on the network

  if(apiConfigured()){
    fetchAndRender().then(startPolling);
  } else {
    dataLoaded = true;
    showBanner('APIのURLが設定されていません。管理者にご確認ください（index.html内のAPI_URLを設定する必要があります）。', 'err');
    render();
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && apiConfigured()){ fetchAndRender(); }
  });

  var refreshPill = document.getElementById('refreshPill');
  if(refreshPill){
    refreshPill.addEventListener('click', function(){
      if(!apiConfigured()){ showToast('APIのURLが設定されていません。'); return; }
      refreshPill.disabled = true;
      fetchAndRender().then(function(){
        showToast('最新の情報に更新しました。');
      }).finally(function(){
        refreshPill.disabled = false;
      });
    });
  }

})();
</script>
</body>
