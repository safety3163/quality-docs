<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>品質発行文書検索</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F1F3EF;
    --surface:#FFFFFF;
    --surface-2:#E7EAE3;
    --border:#D3D7CD;
    --ink:#1A2430;
    --ink-2:#525C63;
    --ink-3:#828B87;
    --accent:#1F5C8B;
    --accent-ink:#FFFFFF;
    --accent-soft:#E2ECF3;
    --good:#2E7D4F;
    --good-soft:#E2F1E7;
    --new:#B8650A;
    --new-soft:#F8EADA;
    --danger:#AF2B20;
    --danger-soft:#F6E4E1;
    --shadow: 0 1px 2px rgba(20,30,25,.06), 0 6px 20px rgba(20,30,25,.07);
    --radius-s:10px;
    --radius-m:16px;
    --radius-l:22px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11161B;
      --surface:#1A2028;
      --surface-2:#212933;
      --border:#333E49;
      --ink:#E8ECEF;
      --ink-2:#AAB5BE;
      --ink-3:#79838C;
      --accent:#74B4E0;
      --accent-ink:#0B1A24;
      --accent-soft:#1D2F3C;
      --good:#75CC9A;
      --good-soft:#17301F;
      --new:#E6A75B;
      --new-soft:#3A2A14;
      --danger:#E88A80;
      --danger-soft:#3A211D;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11161B;
    --surface:#1A2028;
    --surface-2:#212933;
    --border:#333E49;
    --ink:#E8ECEF;
    --ink-2:#AAB5BE;
    --ink-3:#79838C;
    --accent:#74B4E0;
    --accent-ink:#0B1A24;
    --accent-soft:#1D2F3C;
    --good:#75CC9A;
    --good-soft:#17301F;
    --new:#E6A75B;
    --new-soft:#3A2A14;
    --danger:#E88A80;
    --danger-soft:#3A211D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
    -webkit-tap-highlight-color: transparent;
    min-height:100vh;
  }
  .mono{ font-family:'Roboto Mono','Zen Kaku Gothic New',monospace; font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; }
  input,textarea{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }

  .app{ max-width:1080px; margin:0 auto; padding:18px 18px 120px; }

  /* ---------- Header ---------- */
  .appbar{ padding:6px 2px 18px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:38px; height:38px; border-radius:11px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; flex:none; box-shadow:var(--shadow); }
  .brand-text .org{ font-size:12.5px; color:var(--ink-3); letter-spacing:.03em; }
  .brand-text h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:.01em; }
  .tagline{ margin:8px 0 0; font-size:13px; color:var(--ink-2); line-height:1.6; }
  .sync-pill{ display:inline-flex; align-items:center; gap:5px; background:var(--good-soft); color:var(--good);
    border-radius:999px; padding:2px 9px 2px 7px; font-size:12px; font-weight:700; margin-left:4px; vertical-align:1px;
    border:none; cursor:pointer; font:inherit; }
  .sync-pill:hover{ filter:brightness(0.96); }
  .sync-pill[disabled]{ opacity:.6; cursor:default; }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--good); }

  /* ---------- Search ---------- */
  .searchbar{ margin-top:16px; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-l);
    padding:6px 6px 6px 16px; box-shadow:var(--shadow); }
  .searchbar svg{ flex:none; color:var(--ink-3); }
  .searchbar input{ flex:1; border:none; background:transparent; outline:none; font-size:17px; color:var(--ink);
    min-width:0; padding:10px 0; }
  .searchbar input::placeholder{ color:var(--ink-3); }
  .icon-btn{ flex:none; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; background:transparent; color:var(--ink-2);
    transition:background .15s, color .15s; }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn.clear{ width:34px; height:34px; }
  .mic-btn{ background:var(--accent-soft); color:var(--accent); }
  .mic-btn:hover{ background:var(--accent-soft); filter:brightness(0.96); }
  .mic-btn.listening{ background:var(--danger); color:#fff; animation:pulse 1.1s ease-in-out infinite; }
  .mic-btn[disabled]{ opacity:.35; cursor:not-allowed; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(175,43,32,.35);} 50%{ box-shadow:0 0 0 9px rgba(175,43,32,0);} }
  .listen-caption{ font-size:12.5px; color:var(--danger); margin:8px 2px 0; font-weight:700; display:flex; gap:6px; align-items:center; }
  .search-note{ font-size:12.5px; color:var(--ink-3); margin:8px 2px 0; }

  /* ---------- Chips ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding:16px 2px 4px; margin:0 -2px; scrollbar-width:thin; }
  .chip{ flex:none; display:flex; align-items:center; gap:7px; padding:9px 14px; border-radius:999px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--ink-2); font-size:13.5px; font-weight:700;
    cursor:pointer; white-space:nowrap; transition:.15s; }
  .chip:hover{ border-color:var(--accent); color:var(--ink); }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chip .count{ font-size:11.5px; opacity:.8; }
  .chip.all{ font-weight:900; }

  /* ---------- Sections ---------- */
  .section{ margin-top:26px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .section-head h2{ margin:0; font-size:15px; font-weight:900; }
  .section-head .hint{ font-size:12.5px; color:var(--ink-3); }

  .home-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; }
  .home-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:13px; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s, border-color .12s; }
  .home-card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .home-card .hc-top{ display:flex; align-items:center; gap:9px; }
  .thumb{ width:44px; height:44px; border-radius:10px; object-fit:cover; flex:none; border:1px solid var(--border); background:var(--surface-2); }
  .thumb-fallback{ width:44px; height:44px; border-radius:10px; flex:none; background:var(--surface-2); color:var(--ink-3);
    display:flex; align-items:center; justify-content:center; border:1px solid var(--border); }
  .hc-name{ font-size:13.5px; font-weight:700; line-height:1.35; }
  .hc-meta{ margin-top:9px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .hc-date{ font-size:12.5px; color:var(--ink-2); font-weight:600; }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; letter-spacing:.02em;}
  .badge.type{ background:var(--accent-soft); color:var(--accent); }
  .badge.new{ background:var(--new-soft); color:var(--new); }
  .badge.sample{ background:var(--surface-2); color:var(--ink-3); }
  .badge.critical{ background:var(--danger-soft); color:var(--danger); }
  .badge.unseen{ background:var(--danger); color:#fff; }
  .badge.loc{ background:var(--surface-2); color:var(--ink-2); }

  .location-badge{ display:inline-flex; align-items:center; gap:4px; margin-top:8px; padding:5px 10px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink-2); font-size:12px; font-weight:700; cursor:pointer; }
  .location-badge:hover{ background:var(--surface-2); }
  .loc-toggle{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); margin:2px 2px 4px; cursor:pointer; user-select:none; }
  .loc-toggle input{ width:15px; height:15px; }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; gap:4px; margin-top:14px; background:var(--surface-2); padding:4px; border-radius:14px; }
  .tab-btn{ flex:1; border:none; background:transparent; padding:9px 8px; border-radius:11px; font-size:13.5px; font-weight:700;
    color:var(--ink-2); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .tab-btn.active{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .tab-badge{ background:var(--danger); color:#fff; font-size:10.5px; font-weight:800; min-width:17px; height:17px; border-radius:9px;
    display:inline-flex; align-items:center; justify-content:center; padding:0 4px; }
  .tab-badge[hidden]{ display:none; }
  .critical-intro{ display:flex; gap:9px; align-items:flex-start; background:var(--danger-soft); color:var(--danger); border-radius:12px;
    padding:11px 13px; font-size:12.5px; margin-top:14px; line-height:1.55; }
  /* Deliberately NOT position:absolute and NOT pinned to a card corner/edge.
     It used to float at the card's top-right corner, which on a narrow
     tablet screen sits very close to the physical edge of the display —
     a zone many tablets/OSes reserve for edge-swipe gestures (back
     navigation, side panels), which can swallow taps before the page ever
     sees them. Placing it as a normal, labeled, in-flow button well away
     from any edge removes that whole class of problem regardless of
     device or browser. */
  .doc-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .critical-toggle{ align-self:flex-start; display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--ink-3); padding:8px 13px; border-radius:10px; font-size:12.5px; font-weight:700;
    cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .critical-toggle svg{ flex:none; }
  .critical-toggle.on{ background:var(--danger-soft); border-color:transparent; color:var(--danger); }

  /* Small and visually quiet on purpose — deletion should never be the most
     prominent action on a card. It opens a confirmation modal rather than
     deleting immediately (see openDeleteConfirm), so being easy to *reach*
     here is fine; being easy to *complete* is the thing to avoid. */
  .doc-delete-btn{ align-self:flex-start; display:inline-flex; align-items:center; gap:5px; border:1.5px solid transparent;
    background:transparent; color:var(--ink-3); padding:8px 10px; border-radius:10px; font-size:12.5px; font-weight:700;
    cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .doc-delete-btn:hover{ background:var(--danger-soft); color:var(--danger); }
  .doc-delete-btn svg{ flex:none; }

  /* ---------- Critical alert (on-screen notification) ---------- */
  .critical-alert{ position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-16px); width:calc(100% - 28px); max-width:460px;
    background:var(--danger); color:#fff; border-radius:16px; padding:14px 14px 14px 16px; box-shadow:0 10px 30px rgba(0,0,0,.28);
    z-index:200; display:flex; gap:11px; align-items:flex-start; opacity:0; pointer-events:none; transition:opacity .22s, transform .22s; }
  .critical-alert.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .critical-alert .ca-icon{ flex:none; margin-top:1px; animation:ca-pulse 1.4s ease-in-out infinite; }
  .critical-alert .ca-body{ flex:1; min-width:0; }
  .critical-alert .ca-title{ font-weight:800; font-size:14px; margin-bottom:2px; }
  .critical-alert .ca-desc{ font-size:12.5px; line-height:1.5; opacity:.95; }
  .critical-alert .ca-actions{ display:flex; gap:8px; margin-top:10px; }
  .critical-alert .ca-btn{ border:none; border-radius:9px; padding:7px 12px; font-size:12.5px; font-weight:800; cursor:pointer; }
  .critical-alert .ca-btn.primary{ background:#fff; color:var(--danger); }
  .critical-alert .ca-btn.secondary{ background:rgba(255,255,255,.18); color:#fff; }
  .critical-alert .ca-close{ flex:none; background:none; border:none; color:#fff; opacity:.85; cursor:pointer; padding:2px; }
  @keyframes ca-pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }

  /* ---------- Result groups ---------- */
  .group{ margin-bottom:22px; }
  .group-head{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
  .group-head h3{ margin:0; font-size:16.5px; font-weight:900; }
  .group-head .g-count{ font-size:12.5px; color:var(--ink-3); font-weight:700; background:var(--surface-2); padding:2px 9px; border-radius:999px; }

  .timeline{ position:relative; padding-left:20px; }
  .timeline::before{ content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1.5px; background:var(--border); }
  .doc-row{ position:relative; margin-bottom:10px; }
  .doc-row::before{ content:""; position:absolute; left:-19px; top:19px; width:9px; height:9px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg); }
  .doc-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px 14px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; position:relative; }
  .doc-card-top{ display:flex; gap:12px; align-items:flex-start; }
  .doc-main{ flex:1; min-width:0; }
  .doc-date{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .doc-num{ font-size:12px; font-weight:600; color:var(--ink-3); }
  .doc-badges{ display:flex; gap:6px; margin:6px 0; flex-wrap:wrap; }
  .doc-issuer{ font-size:12.5px; color:var(--ink-2); margin-top:2px; }
  .doc-summary{ font-size:12.5px; color:var(--ink-3); margin-top:4px; line-height:1.5; }
  .doc-thumb-wrap{ flex:none; position:relative; }
  .doc-thumb{ width:56px; height:56px; border-radius:10px; object-fit:cover; border:1px solid var(--border); cursor:zoom-in; }
  .thumb-pages{ position:absolute; right:-4px; bottom:-4px; background:var(--ink); color:var(--surface); font-size:9.5px; font-weight:600;
    padding:1px 5px; border-radius:8px; line-height:1.4; border:1.5px solid var(--surface); }
  .lightbox-nav{ position:fixed; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.14); color:#fff; border:none;
    width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .lightbox-nav:hover{ background:rgba(255,255,255,.24); }
  .lightbox-nav.prev{ left:16px; }
  .lightbox-nav.next{ right:16px; }
  .lightbox-close{ position:fixed; top:16px; right:16px; background:rgba(255,255,255,.14); color:#fff; border:none;
    width:40px; height:40px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:1; }
  .lightbox-close:hover{ background:rgba(255,255,255,.24); }
  .lightbox-zoom-controls{ position:fixed; top:16px; left:16px; display:flex; gap:8px; z-index:1; }
  .lightbox-zoom-btn{ background:rgba(255,255,255,.14); color:#fff; border:none; width:40px; height:40px;
    border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .lightbox-zoom-btn:hover{ background:rgba(255,255,255,.24); }
  .lightbox img{ cursor:zoom-in; }
  .lightbox img.zoomed{ cursor:grab; }
  .lightbox img.zoomed.dragging{ cursor:grabbing; }
  .lightbox-page{ position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#fff; font-size:12.5px;
    background:rgba(0,0,0,.4); padding:3px 10px; border-radius:10px; }

  .empty-state{ text-align:center; padding:56px 16px; color:var(--ink-3); }
  .empty-state svg{ margin-bottom:12px; color:var(--ink-3); }
  .empty-state p{ margin:4px 0; font-size:13.5px; }
  .empty-state .big{ font-size:15px; font-weight:700; color:var(--ink-2); }

  /* ---------- FAB ---------- */
  .fab{ position:fixed; right:20px; bottom:22px; z-index:30; display:flex; align-items:center; gap:8px;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:999px; padding:15px 22px 15px 18px;
    font-size:15px; font-weight:800; box-shadow:0 8px 24px rgba(20,30,25,.28); cursor:pointer; }
  .fab:hover{ filter:brightness(1.04); }
  .fab:active{ transform:scale(.98); }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(10,14,18,.5); backdrop-filter:blur(1.5px); z-index:50;
    display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:720px){ .overlay{ align-items:center; } }
  .sheet{ background:var(--surface); width:100%; max-width:620px; max-height:92vh; overflow-y:auto;
    border-radius:22px 22px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.25); }
  @media (min-width:720px){ .sheet{ border-radius:22px; max-height:88vh; } }
  .sheet-head{ position:sticky; top:0; background:var(--surface); z-index:2; display:flex; align-items:center;
    justify-content:space-between; padding:16px 8px 12px 20px; border-bottom:1px solid var(--border); }
  .sheet-head h2{ margin:0; font-size:16.5px; font-weight:900; }
  .sheet-body{ padding:18px 20px 26px; display:flex; flex-direction:column; gap:16px; }

  .photo-drop{ display:flex; flex-direction:column; align-items:center; border:1.5px dashed var(--border);
    border-radius:var(--radius-m); padding:22px; text-align:center;
    cursor:pointer; color:var(--ink-2); background:var(--surface-2); }
  .photo-drop:hover{ border-color:var(--accent); color:var(--ink); }
  .photo-drop svg{ margin-bottom:8px; color:var(--ink-3); }
  .photo-drop .sub{ font-size:12px; color:var(--ink-3); margin-top:4px; }
  .pdf-hint{ margin-top:8px; font-size:12px; color:var(--ink-3); line-height:1.6; text-align:center; }
  .photo-preview{ display:flex; gap:12px; align-items:center; background:var(--surface-2); border-radius:var(--radius-m); padding:10px 12px; }
  .photo-preview img{ width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--border); }
  .photo-preview .pv-name{ font-size:12.5px; color:var(--ink-2); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link-btn{ background:none; border:none; color:var(--accent); font-weight:700; font-size:12.5px; cursor:pointer; padding:6px; }

  .ai-btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px; border-radius:12px;
    border:none; background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:14.5px; cursor:pointer; }
  .ai-btn[disabled]{ opacity:.55; cursor:not-allowed; }
  .ai-status{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink-2); padding:2px 2px; }
  .spinner{ width:16px; height:16px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--accent); animation:spin .7s linear infinite; flex:none; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .ai-note{ font-size:12px; padding:9px 11px; border-radius:10px; }
  .ai-note.ok{ background:var(--good-soft); color:var(--good); }
  .ai-note.warn{ background:var(--new-soft); color:var(--new); }
  .ai-note.err{ background:var(--danger-soft); color:var(--danger); }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:700; color:var(--ink-2); }
  .field .req{ color:var(--danger); }
  .field input, .field textarea{ border:1.5px solid var(--border); border-radius:11px; padding:11px 13px; font-size:14.5px;
    color:var(--ink); background:var(--surface); outline:none; }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:56px; }
  .fhint{ font-size:11.5px; color:var(--ink-3); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px){ .field-row{ grid-template-columns:1fr; } }

  .sheet-foot{ display:flex; gap:10px; padding:14px 20px 20px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--surface); }
  .btn{ flex:1; padding:13px; border-radius:12px; font-size:14.5px; font-weight:800; border:1.5px solid transparent; cursor:pointer; }
  .btn.secondary{ background:var(--surface); border-color:var(--border); color:var(--ink-2); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.primary[disabled]{ opacity:.45; cursor:not-allowed; }
  .btn.danger{ background:var(--danger); color:#fff; }
  .btn.danger[disabled]{ opacity:.45; cursor:not-allowed; }

  .delete-warning{ display:flex; gap:9px; align-items:flex-start; background:var(--danger-soft); color:var(--danger);
    border-radius:12px; padding:12px 13px; font-size:12.5px; line-height:1.55; }
  .delete-warning svg{ flex:none; margin-top:1px; }
  .delete-preview{ display:flex; gap:12px; align-items:flex-start; background:var(--surface-2); border-radius:var(--radius-m); padding:12px; }
  .delete-preview img{ width:56px; height:56px; border-radius:10px; object-fit:cover; border:1px solid var(--border); flex:none; }
  .delete-preview .dp-fallback{ width:56px; height:56px; border-radius:10px; flex:none; background:var(--surface); color:var(--ink-3);
    display:flex; align-items:center; justify-content:center; border:1px solid var(--border); }
  .delete-preview .dp-body{ min-width:0; flex:1; }
  .delete-preview .dp-date{ font-size:13px; font-weight:700; color:var(--ink); }
  .delete-preview .dp-name{ font-size:12.5px; color:var(--ink-2); margin-top:2px; line-height:1.5; }

  /* ---------- Toast ---------- */
  .toast{ position:fixed; left:50%; bottom:26px; transform:translate(-50%, 20px); background:var(--ink); color:var(--bg);
    padding:12px 20px; border-radius:12px; font-size:13.5px; font-weight:700; box-shadow:var(--shadow); z-index:80;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- Lightbox ---------- */
  .lightbox{ position:fixed; inset:0; background:rgba(8,10,13,.85); z-index:90; display:flex; align-items:center; justify-content:center; padding:24px; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:10px; }

  .banner{ display:flex; gap:10px; align-items:flex-start; background:var(--new-soft); color:var(--new); border-radius:12px;
    padding:11px 13px; font-size:12.5px; margin-top:14px; line-height:1.55; }

  .footnote{ margin-top:34px; padding-top:16px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-3); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .footnote button{ background:none; border:none; color:var(--danger); font-weight:700; cursor:pointer; font-size:11.5px; padding:0; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition:none !important; } }
</style>

<datalist id="productNames"></datalist>
<datalist id="docTypes"></datalist>

<script>
(function(){

  // ---------------- Backend API endpoint ----------------
  // Paste the /exec URL of the deployed Code.gs Web App here after
  // deploying it (Deploy > New deployment > Web app > Execute as "Me" >
  // Who has access "Anyone"). Until this is filled in, the app shows an
  // error banner instead of guessing where to send requests.
  var API_URL = 'https://script.google.com/macros/s/AKfycbzEi7uSQf6Qyym9it-B7nXAS_dGBfw082yF7xl5kfLfpkfgCZ0sfc9tFnDlHDlwwq7vsA/exec';
  var POLL_MS = 45000; // how often to re-fetch the document list while the tab is visible

  // ---------------- Utilities ----------------
  // Manual replacement for el.closest(selector): older/locked-down tablet and
  // kiosk browsers (older Android WebViews, older Edge/IE-based enterprise
  // browsers) can lack Element.prototype.closest entirely, or lack it on SVG
  // elements specifically. Since the tap target for a small icon button is
  // almost always the inner <svg>/<path>, a missing closest() here silently
  // breaks every delegated click handler in the app (search chips, the
  // critical-toggle button, the photo lightbox, tab switching) with no
  // visible error. This walks up the DOM by hand and matches with whichever
  // vendor-prefixed matches() implementation is available, so it works even
  // without native closest() support.
  function elMatches(el, selector){
    var m = el.matches || el.webkitMatchesSelector || el.msMatchesSelector || el.mozMatchesSelector || el.oMatchesSelector;
    if(!m) return false;
    try { return m.call(el, selector); } catch(e){ return false; }
  }
  function closestEl(el, selector){
    while(el && el.nodeType === 1){
      if(elMatches(el, selector)) return el;
      el = el.parentElement || el.parentNode;
      if(el && el.nodeType !== 1) el = null;
    }
    return null;
  }
  function normalize(str){
    if(!str) return '';
    var s = String(str).normalize('NFKC').toLowerCase();
    s = s.replace(/[ァ-ヶ]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0x60); });
    s = s.replace(/\s+/g,'');
    return s;
  }
  function fmtDate(iso){
    if(!iso) return '日付不明';
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
    if(!m) return iso;
    return m[1]+'.'+m[2]+'.'+m[3];
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------------- Location (拠点) ----------------
  // There is no login system in this app (it's shared open access within
  // the organization), so "which location is this device" is a per-device
  // preference, not a real account. The employee number below is a light
  // mistake-prevention check (so someone doesn't accidentally set the wrong
  // location on a shared tablet) — NOT real security: this is client-side
  // code, so the numbers are visible to anyone who inspects the page.
  var LOCATIONS = [
    { name:'札幌機材センター', pin:'3516' },
    { name:'東北機材センター', pin:'3163' },
    { name:'四国機材センター', pin:'1138' }
  ];
  var MY_LOCATION_KEY = 'qdocs_my_location_v1';
  var LOC_FILTER_KEY = 'qdocs_loc_filter_v1'; // 'mine' | 'all'
  var myLocation = null;
  var locFilterMode = 'all';
  function loadLocationPrefs(){
    try{
      var raw = localStorage.getItem(MY_LOCATION_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.name && LOCATIONS.some(function(l){ return l.name===parsed.name; })){
          myLocation = parsed.name;
        }
      }
    }catch(e){}
    var storedMode = null;
    try{ storedMode = localStorage.getItem(LOC_FILTER_KEY); }catch(e){}
    locFilterMode = (storedMode==='mine'||storedMode==='all') ? storedMode : (myLocation ? 'mine' : 'all');
  }
  function saveLocFilterMode(mode){
    locFilterMode = mode;
    try{ localStorage.setItem(LOC_FILTER_KEY, mode); }catch(e){}
  }
  function saveMyLocation(name){
    myLocation = name;
    try{ localStorage.setItem(MY_LOCATION_KEY, JSON.stringify({name:name})); }catch(e){}
    saveLocFilterMode('mine');
  }
  function clearMyLocation(){
    myLocation = null;
    try{ localStorage.removeItem(MY_LOCATION_KEY); }catch(e){}
    saveLocFilterMode('all');
  }
  // Documents with no `location` (every document added before this feature
  // existed, or deliberately left blank for a company-wide notice) are
  // treated as visible everywhere rather than hidden by the filter.
  function locationVisibleDocs(){
    if(!myLocation || locFilterMode === 'all') return allDocs;
    return allDocs.filter(function(d){ return !d.location || d.location === myLocation; });
  }
  function renderLocationBar(){
    var badge = document.getElementById('locationBadge');
    if(badge) badge.textContent = myLocation ? ('拠点: '+myLocation+' ▾') : '拠点を設定 ▾';
    var wrap = document.getElementById('locToggleWrap');
    var cb = document.getElementById('locFilterCheckbox');
    if(wrap && cb){
      wrap.style.display = myLocation ? 'flex' : 'none';
      cb.checked = (locFilterMode === 'mine');
    }
  }

  var docThumbMap = {};
  // Image URLs come straight from the `imageUrls` column of the Google
  // Sheet: either a full https://drive.google.com/... URL (documents added
  // through the running app) or a path like "images/foo.jpg" relative to
  // this page (the 67 documents migrated from before go-live, shipped as
  // static files alongside index.html). Both work unmodified as an <img
  // src>, so no per-kind branching is needed here.
  function docThumbs(doc){
    return (doc.imageUrls && doc.imageUrls.length) ? doc.imageUrls : [];
  }
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  // ---------------------------------------------------------------
  // Diagnostics: surface any otherwise-silent JS error as a toast.
  // The 要確認 toggle button has been reported, on multiple devices and
  // in multiple browsers, to sometimes produce no visible reaction at
  // all when tapped. If that is being caused by an exception thrown
  // somewhere in the click-handling code path, the browser would
  // normally swallow it without a trace. These handlers make any such
  // error visible instead, so the real cause can be reported back.
  // ---------------------------------------------------------------
  window.addEventListener('error', function(ev){
    try{ showToast('エラーが発生しました: ' + (ev && ev.message ? ev.message : ev)); }catch(e){}
  });
  window.addEventListener('unhandledrejection', function(ev){
    try{
      var reason = ev && ev.reason;
      var msg = (reason && reason.message) ? reason.message : String(reason);
      showToast('エラーが発生しました: ' + msg);
    }catch(e){}
  });

  // ---------------- State ----------------
  var allDocs = [];      // {id, productNames, issueDate, documentType, issuer, summary, imageUrls, critical, criticalAt, isSample, location, ...} — populated by polling the GAS backend
  var query = '';
  var dataLoaded = false;          // true once the first fetch (success or failure) has completed — distinguishes "still loading" from "genuinely no documents"
  var aiDisabledForSession = false; // set once an aiExtract call fails; stops offering the AI button for the rest of this session
  var pollTimer = null;
  var initialLoadDone = false;      // gates the newly-critical diff so the very first load never triggers the alert banner

  // ---------------- Backend API (GAS Web App) ----------------
  function apiConfigured(){
    return !!API_URL && API_URL.indexOf('PASTE_YOUR_WEB_APP_URL_HERE') === -1 && /^https?:\/\//.test(API_URL);
  }
  // POST as text/plain (never application/json) so the browser treats this
  // as a "simple request" and skips the CORS preflight (OPTIONS) — Apps
  // Script Web Apps don't implement doOptions, so a preflighted request
  // fails outright. Code.gs reads the body via e.postData.contents and
  // JSON.parses it itself.
  function apiPost(action, payload, opts){
    opts = opts || {};
    var body = { action: action };
    if(payload){
      for(var k in payload){ if(Object.prototype.hasOwnProperty.call(payload,k)) body[k] = payload[k]; }
    }
    var fetchOpts = { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) };
    if(opts.signal) fetchOpts.signal = opts.signal;
    return fetch(API_URL, fetchOpts).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    });
  }
  function computeNewlyCritical(prevDocs, freshDocs){
    var prevMap = {};
    prevDocs.forEach(function(d){ prevMap[d.id] = d; });
    var out = [];
    freshDocs.forEach(function(d){
      var was = prevMap[d.id];
      var wasCritical = was ? !!was.critical : false;
      if(d.critical && !wasCritical){ out.push(d); }
    });
    return out;
  }
  // A poll can land while a critical-toggle or delete is still in flight
  // (or has just landed but not yet reflected in the sheet the poll read
  // from). Without this, the freshly-polled data would silently clobber
  // the optimistic UI update, making the action look like it "did nothing".
  function reconcilePending(freshDocs){
    Object.keys(pendingCriticalToggles).forEach(function(pid){
      var patch = pendingCriticalToggles[pid];
      for(var i=0;i<freshDocs.length;i++){
        if(freshDocs[i].id === pid){
          freshDocs[i].critical = patch.critical;
          freshDocs[i].criticalAt = patch.criticalAt;
          break;
        }
      }
    });
    if(Object.keys(pendingDeletes).length){
      freshDocs = freshDocs.filter(function(d){ return !pendingDeletes[d.id]; });
    }
    return freshDocs;
  }
  function fetchAndRender(){
    return fetch(API_URL + '?action=list', { cache:'no-store' }).then(function(r){
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    }).then(function(json){
      if(!json || json.ok !== true || !Array.isArray(json.documents)){
        throw new Error((json && json.error) || 'bad response');
      }
      var fresh = json.documents;
      var newlyCritical = initialLoadDone ? computeNewlyCritical(allDocs, fresh) : [];
      allDocs = reconcilePending(fresh);
      dataLoaded = true;
      initialLoadDone = true;
      render();
      if(newlyCritical.length){ showCriticalAlert(newlyCritical); }
    }).catch(function(err){
      if(!initialLoadDone){
        // Stop showing the loading spinner forever; fall back to whatever
        // (likely empty) state we have and tell the user something's wrong.
        dataLoaded = true;
        showBanner('データの読み込みに失敗しました。しばらくしてから再読み込みしてください。', 'err');
        render();
      } else {
        showToast('最新データの取得に失敗しました。通信状況をご確認ください。');
      }
    });
  }
  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function(){
      if(document.visibilityState === 'visible'){ fetchAndRender(); }
    }, POLL_MS);
  }

  // A likely duplicate is either the same document number as an existing
  // document, or the same set of product names issued on the same date —
  // either is a strong signal someone is about to register the same
  // document twice (e.g. a second location re-photographing a notice a
  // colleague already added). This only WARNS (see the save handler); it
  // never blocks a save someone confirms is intentional (a genuine reissue
  // can share a document number or product/date).
  function findLikelyDuplicate(data){
    var normNum = data.documentNumber ? normalize(data.documentNumber) : '';
    var newNames = (data.productNames||[]).map(normalize).sort().join('|');
    for(var i=0;i<allDocs.length;i++){
      var d = allDocs[i];
      if(normNum && d.documentNumber && normalize(d.documentNumber) === normNum) return d;
      if(data.issueDate && d.issueDate === data.issueDate && newNames){
        var dNames = (d.productNames||[]).map(normalize).sort().join('|');
        if(dNames && dNames === newNames) return d;
      }
    }
    return null;
  }

  // Sends the new document (plus any photos, as base64) to the backend.
  // Once the backend confirms the row was written, insert a local copy
  // right away — using the locally-generated preview thumbnails — so the
  // document appears immediately instead of waiting for the next poll.
  // The next poll then quietly replaces the preview thumbnails with the
  // real Drive-hosted image URLs.
  function addDocument(payload, localThumbs){
    return apiPost('add', payload).then(function(resp){
      if(!resp || resp.ok !== true){ throw new Error((resp && resp.error) || 'add failed'); }
      var nowIso = new Date().toISOString();
      var newDoc = {
        id: resp.id,
        documentNumber: payload.documentNumber,
        documentType: payload.documentType,
        issueDate: payload.issueDate,
        issuer: payload.issuer,
        productNames: payload.productNames,
        summary: payload.summary,
        fileName: payload.fileName,
        location: payload.location,
        critical: false,
        criticalAt: null,
        isSample: false,
        createdAt: nowIso,
        updatedAt: nowIso,
        imageUrls: localThumbs || []
      };
      allDocs.unshift(newDoc);
      render();
    });
  }

  // A document is removed only after the user has explicitly confirmed in
  // the modal opened by openDeleteConfirm (never directly from the card's
  // delete button) — see the comment on .doc-delete-btn's CSS for why.
  var pendingDeletes = {}; // doc.id -> true while a delete is in flight
  function deleteDocument(doc){
    if(pendingDeletes[doc.id]) return Promise.resolve();
    pendingDeletes[doc.id] = true;

    // Optimistic UI update: remove it from the list immediately, revert if
    // the request turns out to have failed. Keep a reference to put it back
    // in the same spot so a failed delete doesn't reorder the list.
    var removed = null, removedIndex = -1;
    for(var i=0;i<allDocs.length;i++){ if(allDocs[i].id === doc.id){ removed = allDocs[i]; removedIndex = i; break; } }
    if(removedIndex !== -1){ allDocs.splice(removedIndex, 1); render(); }

    // A 15s cap ensures the user always gets feedback (success or failure)
    // instead of the confirmation modal appearing to hang forever if the
    // network request stalls or is dropped without ever rejecting.
    return withTimeout(apiPost('delete', {id: doc.id}), 15000).then(function(resp){
      if(!resp || resp.ok !== true) throw new Error((resp && resp.error) || 'delete failed');
      showToast('文書を削除しました。');
    }).catch(function(){
      if(removed){
        allDocs.splice(Math.min(removedIndex, allDocs.length), 0, removed);
        render();
      }
      showToast('削除に失敗しました。もう一度お試しください。');
    }).then(function(){
      delete pendingDeletes[doc.id];
    });
  }

  function showBanner(msg, kind){
    var el = document.getElementById('banner');
    el.innerHTML = '<div class="banner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex:none;margin-top:1px"><path d="M12 9v5M12 17h.01M10.3 3.9L2.5 18a2 2 0 0 0 1.8 3h15.4a2 2 0 0 0 1.8-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>'+escapeHtml(msg)+'</span></div>';
  }

  // ---------------- Index / grouping ----------------
  function buildIndex(docsList){
    docsList = docsList || allDocs;
    var map = {}; // normalized name -> {name, docs:[]}
    docsList.forEach(function(doc){
      (doc.productNames||[]).forEach(function(name){
        if(!name) return;
        var key = normalize(name);
        if(!map[key]) map[key] = { name:name, docs:[] };
        map[key].docs.push(doc);
      });
    });
    Object.keys(map).forEach(function(k){
      map[k].docs.sort(function(a,b){
        if(!a.issueDate) return 1;
        if(!b.issueDate) return -1;
        return b.issueDate < a.issueDate ? -1 : (b.issueDate > a.issueDate ? 1 : 0);
      });
    });
    return map;
  }

  function refreshDatalists(index){
    var pl = document.getElementById('productNames');
    pl.innerHTML = Object.keys(index).map(function(k){ return '<option value="'+escapeHtml(index[k].name)+'">'; }).join('');
    var defaultTypes = ['品質証明書','検査成績書','認定書','ミルシート','出荷証明書','試験成績書'];
    var types = {};
    defaultTypes.forEach(function(t){ types[t]=1; });
    allDocs.forEach(function(d){ if(d.documentType) types[d.documentType]=1; });
    document.getElementById('docTypes').innerHTML = Object.keys(types).map(function(t){ return '<option value="'+escapeHtml(t)+'">'; }).join('');
  }

  // ---------------- Critical (要確認) tab ----------------
  var activeTab = 'search';
  var CRITICAL_SEEN_KEY = 'qdocs_seen_critical_v1';
  var ALL_SEEN_KEY = 'qdocs_seen_all_v1';
  function readIdSet(key){
    try{
      var raw = localStorage.getItem(key);
      return new Set(raw ? JSON.parse(raw) : []);
    }catch(e){ return new Set(); }
  }
  function writeIdSet(key, ids){
    try{ localStorage.setItem(key, JSON.stringify(ids)); }catch(e){}
  }
  function getSeenIds(){ return readIdSet(CRITICAL_SEEN_KEY); }
  function markAllCriticalSeen(){
    writeIdSet(CRITICAL_SEEN_KEY, allDocs.filter(function(d){ return d.critical; }).map(function(d){ return d.id; }));
  }
  function getSeenAllIds(){ return readIdSet(ALL_SEEN_KEY); }
  function markAllDocsSeen(){
    writeIdSet(ALL_SEEN_KEY, allDocs.map(function(d){ return d.id; }));
  }
  function findDoc(id){
    for(var i=0;i<allDocs.length;i++){ if(allDocs[i].id===id) return allDocs[i]; }
    return null;
  }
  var pendingCriticalToggles = {}; // doc.id -> {critical, criticalAt} while a save is in flight
  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var settled = false;
      var t = setTimeout(function(){
        if(settled) return;
        settled = true;
        reject(new Error('timeout'));
      }, ms);
      promise.then(function(v){
        if(settled) return;
        settled = true;
        clearTimeout(t);
        resolve(v);
      }, function(e){
        if(settled) return;
        settled = true;
        clearTimeout(t);
        reject(e);
      });
    });
  }
  function toggleCritical(doc){
    if(pendingCriticalToggles[doc.id]) return; // avoid double-tap while a save is in flight
    var next = !doc.critical;
    var patch = { critical: next, criticalAt: next ? new Date().toISOString() : null };

    // Optimistic UI update: flip immediately so tapping always shows a visible
    // reaction, even before (or if) the network round-trip completes. Record
    // the pending patch BEFORE rendering so a poll that lands mid-flight (see
    // reconcilePending above) re-applies it instead of clobbering it.
    var prevCritical = doc.critical;
    var prevCriticalAt = doc.criticalAt;
    pendingCriticalToggles[doc.id] = patch;
    doc.critical = patch.critical;
    doc.criticalAt = patch.criticalAt;
    render();

    // A 15s cap ensures the user always gets feedback (success or failure)
    // instead of the button silently appearing to do nothing if the network
    // request stalls or is dropped without ever rejecting.
    withTimeout(apiPost('toggleCritical', {id: doc.id, critical: next}), 15000).then(function(resp){
      if(!resp || resp.ok !== true) throw new Error((resp && resp.error) || 'toggle failed');
      showToast(next ? '要確認に設定しました' : '要確認を解除しました');
    }).catch(function(){
      // Revert the optimistic change since the save did not actually happen.
      var d = findDoc(doc.id);
      if(d){ d.critical = prevCritical; d.criticalAt = prevCriticalAt; }
      render();
      showToast('更新に失敗しました。もう一度お試しください。');
    }).then(function(){
      delete pendingCriticalToggles[doc.id];
    });
  }
  function updateTabBadges(){
    var seenCritical = getSeenIds();
    var criticalCount = allDocs.filter(function(d){ return d.critical && !seenCritical.has(d.id); }).length;
    var cBadge = document.getElementById('criticalBadge');
    if(criticalCount>0){ cBadge.hidden=false; cBadge.textContent = criticalCount>99 ? '99+' : String(criticalCount); }
    else{ cBadge.hidden = true; }

    var seenAll = getSeenAllIds();
    var newCount = locationVisibleDocs().filter(function(d){ return !seenAll.has(d.id); }).length;
    var sBadge = document.getElementById('searchBadge');
    if(newCount>0){ sBadge.hidden=false; sBadge.textContent = newCount>99 ? '99+' : String(newCount); }
    else{ sBadge.hidden = true; }
  }
  function applyTabVisibility(){
    var isCritical = activeTab === 'critical';
    document.getElementById('tabSearch').classList.toggle('active', !isCritical);
    document.getElementById('tabCritical').classList.toggle('active', isCritical);
    document.getElementById('criticalIntro').style.display = isCritical ? 'flex' : 'none';
  }

  // ---------------- On-screen alert for new critical documents ----------------
  var pendingAlertDocs = [];
  var alertHideTimer = null;
  function showCriticalAlert(newDocs){
    newDocs.forEach(function(d){
      if(!pendingAlertDocs.some(function(p){ return p.id === d.id; })){
        pendingAlertDocs.push(d);
      }
    });
    renderCriticalAlert();
  }
  function renderCriticalAlert(){
    var el = document.getElementById('criticalAlert');
    if(!pendingAlertDocs.length){
      el.classList.remove('show');
      el.hidden = true;
      return;
    }
    var names = pendingAlertDocs.map(function(d){ return (d.productNames && d.productNames[0]) || '（商品名未設定）'; });
    var uniqueNames = names.filter(function(n,i){ return names.indexOf(n)===i; }).slice(0,3);
    var desc = uniqueNames.map(escapeHtml).join('、') + (names.length>uniqueNames.length ? ' ほか' : '');
    el.hidden = false;
    el.innerHTML =
      '<svg class="ca-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 9v5M12 17h.01M10.3 3.9L2.5 18a2 2 0 0 0 1.8 3h15.4a2 2 0 0 0 1.8-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'+
      '<div class="ca-body">'+
        '<div class="ca-title">新しい「要確認」文書があります（'+pendingAlertDocs.length+'件）</div>'+
        '<div class="ca-desc">'+desc+'</div>'+
        '<div class="ca-actions">'+
          '<button class="ca-btn primary" id="caGoBtn">今すぐ確認</button>'+
          '<button class="ca-btn secondary" id="caDismissBtn">あとで</button>'+
        '</div>'+
      '</div>'+
      '<button class="ca-close" id="caCloseBtn" aria-label="閉じる"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>';
    requestAnimationFrame(function(){ el.classList.add('show'); });
    document.getElementById('caGoBtn').addEventListener('click', function(){
      pendingAlertDocs = [];
      hideCriticalAlert();
      activeTab = 'critical';
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    });
    document.getElementById('caDismissBtn').addEventListener('click', function(){
      pendingAlertDocs = [];
      hideCriticalAlert();
    });
    document.getElementById('caCloseBtn').addEventListener('click', function(){
      pendingAlertDocs = [];
      hideCriticalAlert();
    });
    clearTimeout(alertHideTimer);
    alertHideTimer = setTimeout(function(){
      pendingAlertDocs = [];
      hideCriticalAlert();
    }, 15000);
  }
  function hideCriticalAlert(){
    var el = document.getElementById('criticalAlert');
    el.classList.remove('show');
    clearTimeout(alertHideTimer);
    setTimeout(function(){ if(!pendingAlertDocs.length){ el.hidden = true; } }, 250);
  }
  function renderCriticalHome(docsList, seenBefore){
    var el = document.getElementById('content');
    var list = docsList.slice().sort(function(a,b){
      var ca = a.criticalAt || a.createdAt || '';
      var cb = b.criticalAt || b.createdAt || '';
      return cb < ca ? -1 : (cb > ca ? 1 : 0);
    });
    if(!list.length){
      el.innerHTML = dataLoaded ? emptyHtml('要確認の文書はありません', '品質管理側が重要と判断した文書は、ここに一覧表示されます。') : loadingHtml();
      return;
    }
    var rows = list.map(function(d){ return docCardHtml(d, false, seenBefore); }).join('');
    el.innerHTML = '<div class="timeline">'+rows+'</div>';
  }

  // ---------------- Render ----------------
  function render(){
    var scope = activeTab === 'critical' ? 'critical' : 'all';
    // 要確認 always covers every location — a safety notice must never be
    // missed just because of a location filter. Ordinary product search is
    // scoped to the viewer's own location by default (toggle to see all).
    var scopedDocs = scope === 'critical' ? allDocs : locationVisibleDocs();
    var docsList = scope === 'critical' ? scopedDocs.filter(function(d){ return d.critical; }) : scopedDocs;
    var index = buildIndex(docsList);
    var seenBefore = scope === 'critical' ? getSeenIds() : null;
    refreshDatalists(buildIndex(allDocs));
    renderChips(index);
    applyTabVisibility();
    renderLocationBar();
    renderContent(index, scope, docsList, seenBefore);
    var scopeNote = (scope!=='critical' && myLocation && locFilterMode==='mine') ? '（'+myLocation+'のみ表示中）' : '';
    document.getElementById('totalCount').textContent = scopedDocs.length + ' 件の文書 ・ ' + Object.keys(buildIndex(scopedDocs)).length + ' 商品' + scopeNote;
    if(scope === 'critical'){ markAllCriticalSeen(); } else { markAllDocsSeen(); }
    updateTabBadges();
  }

  function renderChips(index){
    var row = document.getElementById('chipRow');
    var names = Object.keys(index).map(function(k){ return index[k]; }).sort(function(a,b){
      return b.docs.length - a.docs.length || a.name.localeCompare(b.name,'ja');
    });
    var html = '<button class="chip all'+(query===''?' active':'')+'" data-chip="">すべて</button>';
    html += names.map(function(g){
      var active = normalize(query)===normalize(g.name);
      return '<button class="chip'+(active?' active':'')+'" data-chip="'+escapeHtml(g.name)+'">'+escapeHtml(g.name)+' <span class="count">'+g.docs.length+'</span></button>';
    }).join('');
    row.innerHTML = html;
  }

  function docTypeIconSvg(){
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 4h9l3 3v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12h6M9 16h6M9 8h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  }

  function docCardHtml(doc, isLatestInGroup, seenIds){
    var thumbs = docThumbs(doc);
    docThumbMap[doc.id] = thumbs;
    var thumb = thumbs.length
      ? '<div class="doc-thumb-wrap"><img class="doc-thumb" src="'+thumbs[0]+'" data-lightbox="'+escapeHtml(doc.id)+'" alt="文書画像">'+
        (thumbs.length>1 ? '<span class="thumb-pages">全'+thumbs.length+'枚</span>' : '')+'</div>'
      : '<div class="doc-thumb-wrap"><div class="thumb-fallback" style="width:56px;height:56px;border-radius:10px;">'+docTypeIconSvg()+'</div></div>';
    var badges = '';
    if(isLatestInGroup) badges += '<span class="badge new">最新</span>';
    if(doc.documentType) badges += '<span class="badge type">'+escapeHtml(doc.documentType)+'</span>';
    if(doc.isSample) badges += '<span class="badge sample">サンプル</span>';
    if(doc.critical) badges += '<span class="badge critical">要確認</span>';
    if(doc.critical && seenIds && !seenIds.has(doc.id)) badges += '<span class="badge unseen">NEW</span>';
    if(doc.location) badges += '<span class="badge loc">'+escapeHtml(doc.location)+'</span>';
    var toggleBtn = '<button type="button" class="critical-toggle'+(doc.critical?' on':'')+'" data-critical-toggle="'+escapeHtml(doc.id)+'" aria-label="'+(doc.critical?'要確認から外す':'要確認にする')+'">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 9v5M12 17h.01M10.3 3.9L2.5 18a2 2 0 0 0 1.8 3h15.4a2 2 0 0 0 1.8-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'+
      '<span>'+(doc.critical?'要確認を解除':'要確認にする')+'</span>'+
    '</button>';
    // Deliberately a small, low-emphasis icon-only button (not a filled
    // danger-colored button like the critical toggle) — the ask this exists
    // for is "make it possible to remove a badly-photographed registration",
    // not "make deletion a one-tap action". The actual warning/confirmation
    // happens in the modal opened on click (see openDeleteConfirm), never here.
    var deleteBtn = '<button type="button" class="doc-delete-btn" data-delete-doc="'+escapeHtml(doc.id)+'" aria-label="この文書を削除">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.1a2 2 0 0 1-2 1.9H9.8a2 2 0 0 1-2-1.9L7 7h10z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '<span>削除</span>'+
    '</button>';
    return '<div class="doc-row"><div class="doc-card">'+
      '<div class="doc-card-top">'+
        '<div class="doc-main">'+
          '<div class="doc-date mono">'+fmtDate(doc.issueDate)+(doc.documentNumber ? ' <span class="doc-num mono">'+escapeHtml(doc.documentNumber)+'</span>' : '')+'</div>'+
          '<div class="doc-badges">'+badges+'</div>'+
          (doc.issuer ? '<div class="doc-issuer">発行元: '+escapeHtml(doc.issuer)+'</div>' : '')+
          (doc.summary ? '<div class="doc-summary">'+escapeHtml(doc.summary)+'</div>' : '')+
          ((doc.productNames||[]).length>1 ? '<div class="doc-summary">関連商品: '+doc.productNames.map(escapeHtml).join('、')+'</div>' : '')+
        '</div>'+
        thumb+
      '</div>'+
      '<div class="doc-actions">'+toggleBtn+deleteBtn+'</div>'+
    '</div></div>';
  }

  function groupHtml(group, seenIds){
    var rows = group.docs.map(function(d,i){ return docCardHtml(d, i===0, seenIds); }).join('');
    var title = (group.names || [group.name]).join('・');
    return '<section class="group">'+
      '<div class="group-head"><h3>'+escapeHtml(title)+'</h3><span class="g-count">'+group.docs.length+' 件・日付順</span></div>'+
      '<div class="timeline">'+rows+'</div>'+
    '</section>';
  }

  function emptyHtml(title, body){
    return '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'+
      '<p class="big">'+escapeHtml(title)+'</p><p>'+escapeHtml(body)+'</p></div>';
  }
  function loadingHtml(){
    return '<div class="empty-state"><span class="spinner" style="display:inline-block;margin-bottom:14px"></span>'+
      '<p class="big">読み込み中…</p><p>データを取得しています。しばらくお待ちください。</p></div>';
  }

  function renderContent(index, scope, docsList, seenBefore){
    scope = scope || 'all';
    docsList = docsList || allDocs;
    var el = document.getElementById('content');
    var note = document.getElementById('searchNote');
    var nq = normalize(query);
    var isCritical = scope === 'critical';

    if(nq===''){
      note.style.display='none';
      if(isCritical){
        renderCriticalHome(docsList, seenBefore);
        return;
      }
      var recent = docsList.slice().sort(function(a,b){
        if(!a.issueDate) return 1; if(!b.issueDate) return -1;
        return b.issueDate < a.issueDate ? -1 : (b.issueDate>a.issueDate?1:0);
      }).slice(0,6);
      var cards = recent.map(function(d){
        var dThumbs = docThumbs(d);
        var thumb = dThumbs.length ? '<img class="thumb" src="'+dThumbs[0]+'">' : '<div class="thumb-fallback">'+docTypeIconSvg()+'</div>';
        return '<div class="home-card" data-chip="'+escapeHtml((d.productNames&&d.productNames[0])||'')+'">'+
          '<div class="hc-top">'+thumb+'<div class="hc-name">'+escapeHtml((d.productNames||[]).join('、')||'（商品名未設定）')+'</div></div>'+
          '<div class="hc-meta"><span class="doc-date mono hc-date">'+fmtDate(d.issueDate)+'</span>'+(d.documentType?'<span class="badge type">'+escapeHtml(d.documentType)+'</span>':'')+'</div>'+
        '</div>';
      }).join('');
      el.innerHTML = docsList.length ?
        '<div class="section"><div class="section-head"><h2>最近発行された文書</h2><span class="hint">上の検索欄、または商品名から探せます</span></div><div class="home-grid">'+cards+'</div></div>'
        : (dataLoaded ? emptyHtml('まだ文書が登録されていません','右下の「文書を追加」から最初の品質発行文書を登録しましょう。') : loadingHtml());
      return;
    }

    // matches by product name (scoped to docsList via index)
    // Each group's docs are already sorted newest-first (see buildIndex), so
    // docs[0].issueDate is that group's most recent document date. Order the
    // groups themselves by that date (newest first) so the whole result list
    // reads in date order, not just the cards within a single group.
    var matched = Object.keys(index).map(function(k){ return index[k]; })
      .filter(function(g){ return normalize(g.name).indexOf(nq) !== -1; })
      .sort(function(a,b){
        var da = (a.docs[0] && a.docs[0].issueDate) || '';
        var db = (b.docs[0] && b.docs[0].issueDate) || '';
        if(!da && !db) return a.name.localeCompare(b.name,'ja');
        if(!da) return 1;
        if(!db) return -1;
        if(da !== db) return da < db ? 1 : -1;
        return a.name.localeCompare(b.name,'ja');
      });

    if(matched.length){
      note.style.display='block';
      note.textContent = '「'+query+'」に一致する'+(isCritical?'要確認文書の商品 ':'商品 ')+matched.length+'件';

      // One document can be tagged with several product names (e.g. a notice
      // that covers both "吊りパレット" and "吊り輪"). Grouping strictly by
      // matched product name would then render that same document once per
      // matching product — an identical card appearing twice for a single
      // search. Merge groups that share the exact same documents into one
      // section (heading lists all the product names together), and drop a
      // document from any later group once it has already been shown under
      // an earlier one.
      var displayGroups = [];
      var groupBySignature = {}; // doc-id-set signature -> display group
      var alreadyShown = {};
      matched.forEach(function(g){
        var ids = g.docs.map(function(d){ return d.id; }).sort();
        var signature = ids.join('|');
        if(signature && groupBySignature[signature]){
          groupBySignature[signature].names.push(g.name);
          return;
        }
        var freshDocs = g.docs.filter(function(d){ return !alreadyShown[d.id]; });
        if(!freshDocs.length) return; // every document here was already shown above
        freshDocs.forEach(function(d){ alreadyShown[d.id] = true; });
        var displayGroup = { names:[g.name], docs:freshDocs };
        if(signature) groupBySignature[signature] = displayGroup;
        displayGroups.push(displayGroup);
      });

      el.innerHTML = displayGroups.map(function(g){ return groupHtml(g, seenBefore); }).join('');
      return;
    }

    // fallback: search issuer / type / summary
    var other = docsList.filter(function(d){
      return normalize(d.issuer).indexOf(nq)!==-1 || normalize(d.documentType).indexOf(nq)!==-1 || normalize(d.summary).indexOf(nq)!==-1 || normalize(d.documentNumber).indexOf(nq)!==-1;
    });
    if(other.length){
      note.style.display='block';
      note.textContent = '商品名では見つかりませんでした。発行元・文書種別などが一致する'+(isCritical?'要確認文書 ':'文書 ')+other.length+'件を表示しています。';
      other.sort(function(a,b){ if(!a.issueDate) return 1; if(!b.issueDate) return -1; return b.issueDate<a.issueDate?-1:(b.issueDate>a.issueDate?1:0); });
      el.innerHTML = '<div class="timeline">'+other.map(function(d){ return docCardHtml(d,false,seenBefore); }).join('')+'</div>';
      return;
    }

    note.style.display='none';
    el.innerHTML = isCritical
      ? emptyHtml('一致する要確認文書が見つかりませんでした', '商品名の一部を短くして検索するか、「すべて」から要確認文書の一覧に戻ってください。')
      : emptyHtml('一致する文書が見つかりませんでした', '商品名の一部を短くして検索するか、右下から新しい文書を登録してください。');
  }

  // ---------------- Search interactions ----------------
  var searchInput = document.getElementById('searchInput');
  var clearBtn = document.getElementById('clearBtn');
  searchInput.addEventListener('input', function(){
    query = searchInput.value;
    clearBtn.style.display = query ? 'flex' : 'none';
    render();
  });
  clearBtn.addEventListener('click', function(){
    query=''; searchInput.value=''; clearBtn.style.display='none'; render(); searchInput.focus();
  });
  document.getElementById('chipRow').addEventListener('click', function(e){
    var btn = closestEl(e.target, '[data-chip]');
    if(!btn) return;
    query = btn.getAttribute('data-chip') || '';
    searchInput.value = query;
    clearBtn.style.display = query ? 'flex':'none';
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('content').addEventListener('click', function(e){
    try{
      var lb = closestEl(e.target, '[data-lightbox]');
      if(lb){ openLightbox(lb.getAttribute('data-lightbox')); return; }
      var ct = closestEl(e.target, '[data-critical-toggle]');
      if(ct){
        var docId = ct.getAttribute('data-critical-toggle');
        var doc = findDoc(docId);
        if(doc){
          toggleCritical(doc);
        } else {
          // This branch used to fail completely silently. If the toggle
          // button is reported as "unresponsive" again, this toast tells
          // us the click *was* received but the document lookup failed,
          // which points the investigation at a very different place than
          // "the click never arrives".
          showToast('エラー: 文書が見つかりませんでした (id: '+docId+')');
        }
        return;
      }
      var dl = closestEl(e.target, '[data-delete-doc]');
      if(dl){
        var delId = dl.getAttribute('data-delete-doc');
        var delDoc = findDoc(delId);
        if(delDoc){
          openDeleteConfirm(delDoc);
        } else {
          showToast('エラー: 文書が見つかりませんでした (id: '+delId+')');
        }
        return;
      }
      var hc = closestEl(e.target, '.home-card[data-chip]');
      if(hc){
        query = hc.getAttribute('data-chip');
        searchInput.value = query;
        clearBtn.style.display = query? 'flex':'none';
        render();
      }
    }catch(err){
      showToast('エラーが発生しました: ' + (err && err.message ? err.message : err));
    }
  });
  document.getElementById('tabBar').addEventListener('click', function(e){
    var btn = closestEl(e.target, '.tab-btn');
    if(!btn) return;
    var tab = btn.getAttribute('data-tab');
    if(tab === activeTab) return;
    activeTab = tab;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  function openLightbox(docId){
    var thumbs = docThumbMap[docId] || [];
    if(!thumbs.length) return;
    var idx = 0;

    // Mouse-based zoom/pan for desktop (PCs have no pinch gesture). Tablets
    // keep using their native pinch-to-zoom on the <img> untouched — this
    // is purely additive, layered on top via CSS transform + drag, and
    // resets whenever the page changes or the lightbox re-opens.
    var ZOOM_MIN = 1, ZOOM_MAX = 4, ZOOM_STEP = 0.6;
    var zoom = 1, panX = 0, panY = 0;
    var dragging = false, moved = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;

    var wrap = document.createElement('div');
    wrap.className = 'lightbox';

    function clampPan(imgEl){
      if(!imgEl || zoom <= 1){ panX = 0; panY = 0; return; }
      var wrapRect = wrap.getBoundingClientRect();
      var rect = imgEl.getBoundingClientRect();
      // Base (unscaled/untranslated) size, back-computed from the current
      // rendered box, so the bound scales correctly with the zoom level.
      var baseW = rect.width / zoom, baseH = rect.height / zoom;
      var maxX = Math.max(0, (baseW * zoom - wrapRect.width) / 2);
      var maxY = Math.max(0, (baseH * zoom - wrapRect.height) / 2);
      panX = Math.max(-maxX, Math.min(maxX, panX));
      panY = Math.max(-maxY, Math.min(maxY, panY));
    }
    function applyTransform(withTransition){
      var imgEl = wrap.querySelector('img');
      if(!imgEl) return;
      clampPan(imgEl);
      imgEl.style.transition = withTransition ? 'transform .15s ease' : 'none';
      imgEl.style.transform = 'translate('+panX+'px,'+panY+'px) scale('+zoom+')';
      imgEl.classList.toggle('zoomed', zoom > 1);
    }
    function setZoom(next, withTransition){
      zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
      if(zoom === ZOOM_MIN){ panX = 0; panY = 0; }
      applyTransform(withTransition !== false);
    }
    function draw(){
      zoom = 1; panX = 0; panY = 0;
      wrap.innerHTML = '<button class="lightbox-close" aria-label="閉じる" title="閉じる">'+
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'+
        '</button>'+
        '<div class="lightbox-zoom-controls">'+
          '<button class="lightbox-zoom-btn" data-zoom="out" aria-label="縮小" title="縮小">'+
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M8 11h6M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'+
          '</button>'+
          '<button class="lightbox-zoom-btn" data-zoom="in" aria-label="拡大" title="拡大">'+
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'+
          '</button>'+
        '</div>'+
        '<img src="'+thumbs[idx]+'" draggable="false" alt="文書画像">'+
        (thumbs.length>1 ? '<button class="lightbox-nav prev" aria-label="前のページ">‹</button><button class="lightbox-nav next" aria-label="次のページ">›</button><span class="lightbox-page">'+(idx+1)+' / '+thumbs.length+'</span>' : '');
      applyTransform(false);
    }
    function closeLightbox(){
      if(wrap.parentNode) wrap.parentNode.removeChild(wrap);
      document.removeEventListener('keydown', onKeydown);
    }
    function onKeydown(e){
      if(e.key === 'Escape') closeLightbox();
      else if(e.key === '+' || e.key === '='){ setZoom(zoom + ZOOM_STEP); }
      else if(e.key === '-'){ setZoom(zoom - ZOOM_STEP); }
    }
    draw();

    wrap.addEventListener('click', function(e){
      var prev = closestEl(e.target, '.lightbox-nav.prev');
      var next = closestEl(e.target, '.lightbox-nav.next');
      var closeBtn = closestEl(e.target, '.lightbox-close');
      var zoomBtn = closestEl(e.target, '.lightbox-zoom-btn');
      var img = closestEl(e.target, 'img');
      if(prev){ e.stopPropagation(); idx = (idx - 1 + thumbs.length) % thumbs.length; draw(); return; }
      if(next){ e.stopPropagation(); idx = (idx + 1) % thumbs.length; draw(); return; }
      if(closeBtn){ e.stopPropagation(); closeLightbox(); return; }
      if(zoomBtn){
        e.stopPropagation();
        setZoom(zoom + (zoomBtn.getAttribute('data-zoom')==='in' ? ZOOM_STEP : -ZOOM_STEP));
        return;
      }
      if(img){
        if(moved){ moved = false; return; } // just finished a drag — don't also toggle zoom
        // Click-to-zoom: in at ~2.2x centered where clicked, or back out to fit.
        if(zoom > 1){ setZoom(1); }
        else { setZoom(2.2); }
        return;
      }
      closeLightbox();
    });

    // Mouse-wheel zoom (desktop only — touch devices don't fire wheel events
    // for pinch gestures, so this never fights with native pinch-zoom).
    wrap.addEventListener('wheel', function(e){
      var img = closestEl(e.target, 'img');
      if(!img) return;
      e.preventDefault();
      setZoom(zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP), false);
    }, { passive:false });

    // Drag-to-pan once zoomed in (mouse only; touch devices pan via the
    // OS/browser's native pinch-zoomed scrolling instead).
    wrap.addEventListener('mousedown', function(e){
      var img = closestEl(e.target, 'img');
      if(!img || zoom <= 1) return;
      dragging = true; moved = false;
      dragStartX = e.clientX; dragStartY = e.clientY;
      panStartX = panX; panStartY = panY;
      img.classList.add('dragging');
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e){
      if(!dragging) return;
      var dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
      if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      panX = panStartX + dx; panY = panStartY + dy;
      applyTransform(false);
    });
    document.addEventListener('mouseup', function(){
      if(!dragging) return;
      dragging = false;
      var img = wrap.querySelector('img');
      if(img) img.classList.remove('dragging');
    });

    document.addEventListener('keydown', onKeydown);
    document.body.appendChild(wrap);
  }

  var PDFJS_VERSION = '3.11.174';
  var PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VERSION + '/';
  var pdfJsLoadPromise = null;
  function loadPdfJs(){
    if(pdfJsLoadPromise) return pdfJsLoadPromise;
    pdfJsLoadPromise = new Promise(function(resolve, reject){
      if(window['pdfjs-dist/build/pdf']){ resolve(window['pdfjs-dist/build/pdf']); return; }
      var s = document.createElement('script');
      s.src = PDFJS_BASE + 'pdf.min.js';
      s.onload = function(){
        var lib = window['pdfjs-dist/build/pdf'];
        if(!lib){ reject(new Error('pdfjsLib missing after load')); return; }
        lib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
        resolve(lib);
      };
      s.onerror = function(){ reject(new Error('failed to load pdf.js')); };
      document.head.appendChild(s);
    }).catch(function(err){
      pdfJsLoadPromise = null; // let a later attempt try again instead of staying broken
      throw err;
    });
    return pdfJsLoadPromise;
  }

  function loadImageBitmapish(file){
    if(window.createImageBitmap){

  function loadViaImgTag(file){
    return new Promise(function(resolve,reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  function imageToCanvas(imgLike){
    var c = document.createElement('canvas');
    c.width = imgLike.width; c.height = imgLike.height;
    c.getContext('2d').drawImage(imgLike,0,0);
    return c;
  }
  function thumbnailDataUrlFromCanvas(canvas, maxDim, startQ, maxLen){
    maxLen = maxLen || 170000;
    var w0 = canvas.width, h0 = canvas.height;
    var scale = Math.min(1, maxDim/Math.max(w0,h0));
    var w = Math.max(1,Math.round(w0*scale)), h = Math.max(1,Math.round(h0*scale));
    var c2 = document.createElement('canvas');
    c2.width=w; c2.height=h;
    c2.getContext('2d').drawImage(canvas,0,0,w,h);
    var q = startQ;
    var url = c2.toDataURL('image/jpeg', q);
    while(url.length > maxLen && q > 0.28){
      q -= 0.1;
      url = c2.toDataURL('image/jpeg', q);
    }
    return url;
  }
  // Converts a Blob/File to a bare base64 string (no "data:...;base64," prefix)
  // for sending to the backend as JSON — used both for AI extraction and for
  // the permanent Drive upload on save.
  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var result = reader.result || '';
        var idx = result.indexOf(',');
        resolve(idx !== -1 ? result.slice(idx+1) : result);
      };
      reader.onerror = function(){ reject(reader.error || new Error('file read failed')); };
      reader.readAsDataURL(blob);
    });
  }
  function onFilePicked(e){

    if(isPdf){ handlePdfFile(file); return; }

    pendingFile = file;

    loadImageBitmapish(file).then(function(img){
      var canvas = imageToCanvas(img);
      pendingThumb = thumbnailDataUrlFromCanvas(canvas, 640, 0.62);

      pendingAiBlobs = [file];
