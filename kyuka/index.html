<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>休暇届申請</title>
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="icons/site.webmanifest">
<meta name="theme-color" content="#0A5295">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@500;600&display=swap">
<style>
  :root{
    --blue:#0A5295;
    --blue-dark:#073D70;
    --bg:#F1F3EF;
    --card:#FFFFFF;
    --line:#DCE1DD;
    --text:#22282B;
    --muted:#6B7580;
    --ok:#1E8E5A;
    --ok-bg:#E6F5EC;
    --warn:#C9852A;
    --warn-bg:#FBF0DF;
    --bad:#C0392B;
    --bad-bg:#FBE8E5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
  }
  header{
    background:var(--blue);
    color:#fff;
    padding:18px 16px 16px;
    position:sticky; top:0; z-index:10;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header h1{
    margin:0 0 2px;
    font-size:18px;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:12px;
    opacity:.85;
  }
  .tabs{
    display:flex;
    max-width:720px;
    margin:14px auto 0;
    padding:0 12px;
    gap:8px;
  }
  .tab-btn{
    flex:1;
    padding:11px 6px;
    border:none;
    border-radius:10px 10px 0 0;
    background:rgba(10,82,149,.10);
    color:var(--blue-dark);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .tab-btn.active{
    background:var(--card);
    color:var(--blue);
    box-shadow:0 -1px 4px rgba(0,0,0,.08);
  }
  main{
    max-width:720px;
    margin:0 auto;
    padding:16px 12px 0;
  }
  .view{ display:none; }
  .view.active{ display:block; }

  .card{
    background:var(--card);
    border-radius:14px;
    padding:18px 16px;
    box-shadow:0 1px 6px rgba(0,0,0,.06);
    margin-bottom:16px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--blue-dark);
    margin-bottom:6px;
  }
  .field .hint{
    font-size:11px;
    color:var(--muted);
    font-weight:400;
    margin-left:6px;
  }
  select, input[type=text], input[type=date], input[type=datetime-local], textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:15px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
  }
  textarea{ resize:vertical; min-height:64px; }
  select:focus, input:focus, textarea:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(10,82,149,.12);
  }
  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .cat-opt{
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 10px;
    font-size:13.5px;
    cursor:pointer;
    background:#fff;
    text-align:center;
    user-select:none;
  }
  .cat-opt.selected{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
    font-weight:700;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    align-items:end;
  }
  .calc-note{
    font-size:12.5px;
    color:var(--blue-dark);
    margin-top:6px;
    font-weight:700;
  }
  .sub-block{
    border-left:3px solid var(--blue);
    padding-left:12px;
    margin-top:4px;
  }
  .submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--blue);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .submit-btn:active{ background:var(--blue-dark); }
  .submit-btn:disabled{ opacity:.5; }

  .msg{
    margin-top:12px;
    padding:11px 12px;
    border-radius:9px;
    font-size:13.5px;
    font-weight:700;
    display:none;
  }
  .msg.ok{ display:block; background:var(--ok-bg); color:var(--ok); }
  .msg.bad{ display:block; background:var(--bad-bg); color:var(--bad); }

  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .cal-nav-btn{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    width:36px; height:36px;
    font-size:18px;
    font-weight:700;
    color:var(--blue-dark);
    cursor:pointer;
    font-family:inherit;
  }
  .cal-title{ font-size:15px; font-weight:700; color:var(--blue-dark); }
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:11px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:4px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
  }
  .cal-cell{
    min-height:60px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:3px 2px;
    background:#fff;
    cursor:pointer;
    overflow:hidden;
  }
  .cal-cell.empty{ background:transparent; border-color:transparent; cursor:default; }
  .cal-cell.today{ border-color:var(--blue); border-width:2px; }
  .cal-daynum{ font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:2px; }
  .cal-pill{
    font-size:9px;
    font-weight:700;
    padding:1.5px 3px;
    border-radius:5px;
    margin-bottom:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cal-pill.承認済み{ background:var(--ok-bg); color:var(--ok); }
  .cal-pill.未承認{ background:var(--warn-bg); color:var(--warn); }
  .cal-pill.more{ background:var(--bg); color:var(--muted); text-align:center; }
  .cal-legend{
    display:flex;
    gap:14px;
    margin-top:12px;
    font-size:11.5px;
    color:var(--muted);
  }
  .cal-legend-item{ display:flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot-ok{ background:var(--ok); }
  .dot-warn{ background:var(--warn); }
  #cal-detail-list .det-row{
    padding:8px 0;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  #cal-detail-list .det-row:first-child{ border-top:none; }
  .badge{
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.未承認{ background:var(--warn-bg); color:var(--warn); }
  .badge.承認済み{ background:var(--ok-bg); color:var(--ok); }
  .badge.却下{ background:var(--bad-bg); color:var(--bad); }
</style>
</head>
<body>

<header>
  <h1>休暇届申請</h1>
  <p>日本セイフティー株式会社　東北機材センター</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="apply">申請</button>
  <button class="tab-btn" data-tab="calendar">カレンダー</button>
</div>

<main>

  <!-- ===== 申請 タブ ===== -->
  <section id="view-apply" class="view active">
    <div class="card">
      <div class="field">
        <label>氏名</label>
        <select id="f-name">
          <option value="">選択してください</option>
        </select>
      </div>

      <div class="field">
        <label>区分</label>
        <div class="cat-grid" id="cat-grid"></div>
      </div>

      <div class="field" id="paid-leave-sub">
        <label>取得区分<span class="hint">全日・半休・時間休を選択</span></label>
        <div class="cat-grid" id="subtype-grid"></div>
      </div>

      <div class="field" id="block-day">
        <label>期間<span class="hint">複数日にわたる場合</span></label>
        <div class="sub-block">
          <div class="row2">
            <div>
              <label style="font-weight:400;font-size:12px;">開始日</label>
              <input type="date" id="f-datefrom">
            </div>
            <div>
              <label style="font-weight:400;font-size:12px;">終了日</label>
              <input type="date" id="f-dateto">
            </div>
          </div>
          <div class="calc-note" id="days-note"></div>
        </div>
      </div>

      <div class="field" id="block-halfday" style="display:none;">
        <label>取得日</label>
        <div class="sub-block">
          <input type="date" id="f-halfday">
        </div>
      </div>

      <div class="field" id="block-time" style="display:none;">
        <label>日時<span class="hint">時間単位の場合</span></label>
        <div class="sub-block">
          <div class="row2">
            <div>
              <label style="font-weight:400;font-size:12px;">開始</label>
              <input type="datetime-local" id="f-dtfrom">
            </div>
            <div>
              <label style="font-weight:400;font-size:12px;">終了</label>
              <input type="datetime-local" id="f-dtto">
            </div>
          </div>
          <div class="calc-note" id="hours-note"></div>
        </div>
      </div>

      <div class="field">
        <label>事由</label>
        <textarea id="f-reason" placeholder="申請理由を入力してください"></textarea>
      </div>

      <div class="field">
        <label>備考<span class="hint">任意</span></label>
        <textarea id="f-remarks" placeholder=""></textarea>
      </div>

      <button class="submit-btn" id="btn-submit">申請する</button>
      <div class="msg" id="apply-msg"></div>
    </div>
  </section>

  <!-- ===== カレンダー タブ ===== -->
  <section id="view-calendar" class="view">
    <div class="card">
      <div class="cal-nav">
        <button class="cal-nav-btn" id="cal-prev">‹</button>
        <div class="cal-title" id="cal-title"></div>
        <button class="cal-nav-btn" id="cal-next">›</button>
      </div>
      <div class="cal-weekdays">
        <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">
        <span class="cal-legend-item"><span class="dot dot-ok"></span>承認済み</span>
        <span class="cal-legend-item"><span class="dot dot-warn"></span>未承認</span>
      </div>
    </div>
    <div class="card" id="cal-detail" style="display:none;">
      <div id="cal-detail-title" style="font-weight:700; color:var(--blue-dark); margin-bottom:4px;"></div>
      <div id="cal-detail-list"></div>
    </div>
  </section>

</main>

<script>
// ▼▼▼ デプロイ後、Apps ScriptのウェブアプリURLに置き換えてください ▼▼▼
const GAS_URL = "https://script.google.com/macros/s/AKfycbxeKNRgxoeSAtl_CCSZLjl_r8nd6mY4WLvQQ939lQLJzcVMTDHfuaV7A822x0kvO8t3/exec";
// ▲▲▲

const CATEGORIES = ['1.有給休暇','2.振替休暇','3.慶弔休暇','4.特別休暇','5.欠勤','6.遅刻','7.早退','8.私用外出','9.休日出勤','10.看護休暇'];
const SUBTYPES = ['全日','午前半休','午後半休','時間休'];

let staffList = [];
let requestsCache = [];
let selectedCategory = '';
let paidLeaveSubtype = '全日';

/* ---------- タブ切替 ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'calendar') loadData();
  });
});

/* ---------- 区分グリッド生成 ---------- */
const catGrid = document.getElementById('cat-grid');
CATEGORIES.forEach(cat=>{
  const div = document.createElement('div');
  div.className = 'cat-opt';
  div.textContent = cat.replace(/^\d+\./,'').trim();
  div.dataset.cat = cat;
  div.addEventListener('click', ()=>selectCategory(cat));
  catGrid.appendChild(div);
});

/* ---------- 有給休暇 取得区分グリッド生成 ---------- */
const subtypeGrid = document.getElementById('subtype-grid');
SUBTYPES.forEach(sub=>{
  const div = document.createElement('div');
  div.className = 'cat-opt';
  div.textContent = sub;
  div.dataset.sub = sub;
  div.addEventListener('click', ()=>selectSubtype(sub));
  subtypeGrid.appendChild(div);
});

function selectCategory(cat){
  selectedCategory = cat;
  document.querySelectorAll('#cat-grid .cat-opt').forEach(el=>{
    el.classList.toggle('selected', el.dataset.cat === cat);
  });
  // どの区分でも、取得区分（全日・半休・時間休）の選び方は統一
  selectSubtype(paidLeaveSubtype || '全日');
}

function selectSubtype(sub){
  paidLeaveSubtype = sub;
  document.querySelectorAll('#subtype-grid .cat-opt').forEach(el=>{
    el.classList.toggle('selected', el.dataset.sub === sub);
  });
  document.getElementById('block-day').style.display = (sub === '全日') ? 'block' : 'none';
  document.getElementById('block-halfday').style.display = (sub === '午前半休' || sub === '午後半休') ? 'block' : 'none';
  document.getElementById('block-time').style.display = (sub === '時間休') ? 'block' : 'none';
}

/* ---------- 日数・時間の自動計算 ---------- */
function calcDays(){
  const from = document.getElementById('f-datefrom').value;
  const to = document.getElementById('f-dateto').value;
  const note = document.getElementById('days-note');
  if (!from || !to) { note.textContent = ''; return; }
  const d1 = new Date(from), d2 = new Date(to);
  const diff = Math.round((d2-d1)/86400000) + 1;
  note.textContent = diff >= 1 ? diff + ' 日間' : '終了日は開始日以降にしてください';
}
document.getElementById('f-datefrom').addEventListener('change', calcDays);
document.getElementById('f-dateto').addEventListener('change', calcDays);

function calcHours(){
  const from = document.getElementById('f-dtfrom').value;
  const to = document.getElementById('f-dtto').value;
  const note = document.getElementById('hours-note');
  if (!from || !to) { note.textContent = ''; return; }
  const d1 = new Date(from), d2 = new Date(to);
  const diffMin = Math.round((d2-d1)/60000);
  if (diffMin < 0) { note.textContent = '終了は開始より後にしてください'; return; }
  const h = Math.floor(diffMin/60), m = diffMin % 60;
  note.textContent = h + ' 時間 ' + m + ' 分';
}
document.getElementById('f-dtfrom').addEventListener('change', calcHours);
document.getElementById('f-dtto').addEventListener('change', calcHours);

/* ---------- 申請送信 ---------- */
document.getElementById('btn-submit').addEventListener('click', async ()=>{
  const msg = document.getElementById('apply-msg');
  msg.className = 'msg';

  const name = document.getElementById('f-name').value;
  if (!name){ showMsg(msg,'氏名を選択してください', false); return; }
  if (!selectedCategory){ showMsg(msg,'区分を選択してください', false); return; }

  let dateFrom = document.getElementById('f-datefrom').value;
  let dateTo = document.getElementById('f-dateto').value;
  let dtFrom = document.getElementById('f-dtfrom').value;
  let dtTo = document.getElementById('f-dtto').value;
  let categoryDetail = '';

  if (paidLeaveSubtype === '午前半休' || paidLeaveSubtype === '午後半休'){
    const day = document.getElementById('f-halfday').value;
    if (!day){ showMsg(msg,'取得日を入力してください', false); return; }
    dateFrom = day; dateTo = day;
    dtFrom = ''; dtTo = '';
    categoryDetail = paidLeaveSubtype;
  } else if (paidLeaveSubtype === '時間休'){
    dateFrom = ''; dateTo = '';
    categoryDetail = paidLeaveSubtype;
  } else {
    dtFrom = ''; dtTo = '';
    categoryDetail = '';
  }

  let days = '';
  if (paidLeaveSubtype === '午前半休' || paidLeaveSubtype === '午後半休'){
    days = 0.5;
  } else if (dateFrom && dateTo){
    const diff = Math.round((new Date(dateTo)-new Date(dateFrom))/86400000)+1;
    days = diff >= 1 ? diff : '';
  }
  let hours = '';
  if (dtFrom && dtTo){
    const diffMin = Math.round((new Date(dtTo)-new Date(dtFrom))/60000);
    if (diffMin >= 0) hours = Math.floor(diffMin/60)+':'+String(diffMin%60).padStart(2,'0');
  }

  const payload = {
    name: name,
    category: selectedCategory,
    categoryDetail: categoryDetail,
    dateFrom: dateFrom, dateTo: dateTo, days: days,
    dtFrom: dtFrom, dtTo: dtTo, hours: hours,
    reason: document.getElementById('f-reason').value,
    remarks: document.getElementById('f-remarks').value
  };

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = '送信中...';
  try{
    const res = await postAction('submit', payload);
    if (res.ok){
      showMsg(msg, '申請しました。承認をお待ちください。', true);
      resetForm();
    } else {
      showMsg(msg, 'エラー: ' + (res.error||'送信に失敗しました'), false);
    }
  } catch(err){
    showMsg(msg, '通信エラーが発生しました。時間をおいて再度お試しください。', false);
  } finally {
    btn.disabled = false; btn.textContent = '申請する';
  }
});

function resetForm(){
  document.getElementById('f-name').value = '';
  selectedCategory = '';
  paidLeaveSubtype = '全日';
  document.querySelectorAll('.cat-opt').forEach(el=>el.classList.remove('selected'));
  document.getElementById('block-day').style.display = 'block';
  document.getElementById('block-halfday').style.display = 'none';
  document.getElementById('block-time').style.display = 'none';
  ['f-datefrom','f-dateto','f-dtfrom','f-dtto','f-halfday','f-reason','f-remarks'].forEach(id=>{
    document.getElementById(id).value = '';
  });
  document.getElementById('days-note').textContent = '';
  document.getElementById('hours-note').textContent = '';
}

function showMsg(el, text, ok){
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'bad');
  el.style.display = 'block';
}

/* ---------- データ読み込み（氏名リスト・カレンダー用） ---------- */
async function loadData(){
  try{
    const res = await fetch(GAS_URL + '?action=list');
    const data = await res.json();
    if (!data.ok) return;

    staffList = data.staff || [];
    requestsCache = data.requests || [];
    fillNameSelects();
    renderCalendar();
  } catch(err){
    // 通信エラーは氏名リスト・カレンダーの更新のみに影響
  }
}

function fillNameSelects(){
  const nameSel = document.getElementById('f-name');
  if (nameSel.options.length <= 1){
    staffList.forEach(n=>{
      const o = document.createElement('option'); o.value = n; o.textContent = n;
      nameSel.appendChild(o);
    });
  }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function postAction(action, payload){
  const res = await fetch(GAS_URL + '?action=' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORSプリフライト回避
    body: JSON.stringify(payload)
  });
  return res.json();
}

/* ---------- カレンダー ---------- */
let calCursor = new Date();
calCursor.setDate(1);
calCursor.setHours(0,0,0,0);

function toDateKey(v){
  if (!v) return '';
  const m = String(v).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (!m) return '';
  return m[1] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
}

function getRequestsForDate(dateKey){
  return requestsCache.filter(r=>{
    const status = r['承認状況'] || '未承認';
    if (status === '却下') return false;
    if (r['期間開始日'] && r['期間終了日']){
      const from = toDateKey(r['期間開始日']), to = toDateKey(r['期間終了日']);
      return from && to && dateKey >= from && dateKey <= to;
    } else if (r['開始日時']){
      return toDateKey(r['開始日時']) === dateKey;
    }
    return false;
  });
}

function renderCalendar(){
  const year = calCursor.getFullYear();
  const month = calCursor.getMonth();
  document.getElementById('cal-title').textContent = year + '年 ' + (month+1) + '月';

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayKey = toDateKey(new Date().getFullYear() + '-' + (new Date().getMonth()+1) + '-' + new Date().getDate());

  let html = '';
  for (let i=0;i<firstDow;i++) html += '<div class="cal-cell empty"></div>';
  for (let d=1; d<=daysInMonth; d++){
    const dateKey = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const items = getRequestsForDate(dateKey);
    const isToday = dateKey === todayKey;
    let pillsHtml = items.slice(0,3).map(r=>{
      const st = r['承認状況']||'未承認';
      return '<div class="cal-pill '+st+'">'+esc(r['氏名'])+'</div>';
    }).join('');
    if (items.length > 3) pillsHtml += '<div class="cal-pill more">+'+(items.length-3)+'</div>';
    html += '<div class="cal-cell'+(isToday?' today':'')+'" onclick="showDayDetail(\''+dateKey+'\')">'
          + '<div class="cal-daynum">'+d+'</div>'
          + pillsHtml
          + '</div>';
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function showDayDetail(dateKey){
  const items = getRequestsForDate(dateKey);
  const panel = document.getElementById('cal-detail');
  const title = document.getElementById('cal-detail-title');
  const list = document.getElementById('cal-detail-list');
  const parts = dateKey.split('-');
  title.textContent = parts[0]+'年'+parseInt(parts[1],10)+'月'+parseInt(parts[2],10)+'日の休暇・予定';

  if (items.length === 0){
    list.innerHTML = '<div class="empty" style="padding:10px 0;">この日の申請はありません。</div>';
  } else {
    list.innerHTML = items.map(r=>{
      const status = r['承認状況']||'未承認';
      const catLabel = (r['区分']||'').replace(/^\d+\./,'').trim() + (r['区分詳細'] ? '（'+r['区分詳細']+'）' : '');
      return '<div class="det-row"><b>'+esc(r['氏名'])+'</b>　'+esc(catLabel)
        + ' <span class="badge '+status+'" style="margin-left:6px;">'+status+'</span></div>';
    }).join('');
  }
  panel.style.display = 'block';
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

document.getElementById('cal-prev').addEventListener('click', ()=>{
  calCursor.setMonth(calCursor.getMonth()-1);
  document.getElementById('cal-detail').style.display = 'none';
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', ()=>{
  calCursor.setMonth(calCursor.getMonth()+1);
  document.getElementById('cal-detail').style.display = 'none';
  renderCalendar();
});

/* 初期表示: 申請タブでも氏名リストが要るので先読み */
loadData();
selectCategory('1.有給休暇');
renderCalendar();
</script>
