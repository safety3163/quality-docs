<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>休暇届 承認</title>
<link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A5295">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@500;600&display=swap">
<style>
  :root{
    --blue:#0A5295;
    --blue-dark:#073D70;
    --bg:#F1F3EF;
    --card:#FFFFFF;
    --line:#DCE1DD;
    --text:#22282B;
    --muted:#6B7580;
    --ok:#1E8E5A;
    --ok-bg:#E6F5EC;
    --warn:#C9852A;
    --warn-bg:#FBF0DF;
    --bad:#C0392B;
    --bad-bg:#FBE8E5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:40px;
  }
  header{
    background:var(--blue);
    color:#fff;
    padding:18px 16px 16px;
    position:sticky; top:0; z-index:10;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header h1{
    margin:0 0 2px;
    font-size:18px;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:12px;
    opacity:.85;
  }
  .tabs{
    display:flex;
    max-width:720px;
    margin:14px auto 0;
    padding:0 12px;
    gap:8px;
  }
  .tab-btn{
    flex:1;
    padding:11px 6px;
    border:none;
    border-radius:10px 10px 0 0;
    background:rgba(10,82,149,.10);
    color:var(--blue-dark);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .tab-btn.active{
    background:var(--card);
    color:var(--blue);
    box-shadow:0 -1px 4px rgba(0,0,0,.08);
  }
  main{
    max-width:720px;
    margin:0 auto;
    padding:16px 12px 0;
  }
  .view{ display:none; }
  .view.active{ display:block; }

  .card{
    background:var(--card);
    border-radius:14px;
    padding:18px 16px;
    box-shadow:0 1px 6px rgba(0,0,0,.06);
    margin-bottom:16px;
  }
  select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:15px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
  }
  .filter-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    font-size:13.5px;
  }
  .filter-row select{ width:auto; flex:1; }
  .switch{
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
    font-weight:700;
    color:var(--blue-dark);
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--blue-dark);
    margin-bottom:6px;
  }
  .field .hint{
    font-size:11px;
    color:var(--muted);
    font-weight:400;
    margin-left:6px;
  }
  input[type=text], input[type=date], input[type=datetime-local]{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:15px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
  }
  input:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(10,82,149,.12);
  }
  .sub-block{
    border-left:3px solid var(--blue);
    padding-left:12px;
    margin-top:4px;
  }
  .calc-note{
    font-size:12.5px;
    color:var(--blue-dark);
    margin-top:6px;
    font-weight:700;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .cat-opt{
    border:1px solid var(--line);
    border-radius:9px;
    padding:10px 10px;
    font-size:13.5px;
    cursor:pointer;
    background:#fff;
    text-align:center;
    user-select:none;
  }
  .cat-opt.selected{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
    font-weight:700;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    align-items:end;
  }
  .submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--blue);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .submit-btn:active{ background:var(--blue-dark); }
  .submit-btn:disabled{ opacity:.5; }
  .msg{
    margin-top:12px;
    padding:11px 12px;
    border-radius:9px;
    font-size:13.5px;
    font-weight:700;
    display:none;
  }
  .msg.ok{ display:block; background:var(--ok-bg); color:var(--ok); }
  .msg.bad{ display:block; background:var(--bad-bg); color:var(--bad); }
  .mgr-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 0;
    border-top:1px solid var(--line);
  }
  .mgr-row:first-child{ border-top:none; }
  .mgr-info b{ font-size:14px; }
  .mgr-period{ font-size:12px; color:var(--muted); margin-top:2px; }
  .mgr-del{
    flex-shrink:0;
    padding:8px 14px;
    border:1px solid var(--bad);
    border-radius:8px;
    background:#fff;
    color:var(--bad);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .mgr-del:disabled{ opacity:.5; }

  .req-card{
    background:var(--card);
    border-radius:12px;
    padding:14px 14px;
    margin-bottom:10px;
    box-shadow:0 1px 6px rgba(0,0,0,.06);
    border-left:5px solid var(--muted);
  }
  .req-card.st-未承認{ border-left-color:var(--warn); }
  .req-card.st-承認済み{ border-left-color:var(--ok); }
  .req-card.st-却下{ border-left-color:var(--bad); }

  .req-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    margin-bottom:6px;
  }
  .req-name{ font-weight:700; font-size:15px; }
  .req-cat{ font-size:12.5px; color:var(--blue-dark); font-weight:700; margin-top:2px; }
  .badge{
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.未承認{ background:var(--warn-bg); color:var(--warn); }
  .badge.承認済み{ background:var(--ok-bg); color:var(--ok); }
  .badge.却下{ background:var(--bad-bg); color:var(--bad); }

  .req-meta{ font-size:13px; color:var(--text); line-height:1.6; margin-top:4px; }
  .req-meta .k{ color:var(--muted); }
  .req-reason{
    font-size:13px;
    margin-top:8px;
    background:var(--bg);
    padding:8px 10px;
    border-radius:8px;
    white-space:pre-wrap;
  }
  .req-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .req-actions button{
    flex:1;
    padding:9px;
    border:none;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-approve{ background:var(--ok); color:#fff; }
  .btn-reject{ background:#fff; color:var(--bad); border:1px solid var(--bad) !important; }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    padding:30px 10px;
  }
  .loading{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px;
  }

  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .cal-nav-btn{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    width:36px; height:36px;
    font-size:18px;
    font-weight:700;
    color:var(--blue-dark);
    cursor:pointer;
    font-family:inherit;
  }
  .cal-title{ font-size:15px; font-weight:700; color:var(--blue-dark); }
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:11px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:4px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
  }
  .cal-cell{
    min-height:60px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:3px 2px;
    background:#fff;
    cursor:pointer;
    overflow:hidden;
  }
  .cal-cell.empty{ background:transparent; border-color:transparent; cursor:default; }
  .cal-cell.today{ border-color:var(--blue); border-width:2px; }
  .cal-daynum{ font-size:10.5px; color:var(--muted); font-weight:700; margin-bottom:2px; }
  .cal-pill{
    font-size:9px;
    font-weight:700;
    padding:1.5px 3px;
    border-radius:5px;
    margin-bottom:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cal-pill.承認済み{ background:var(--ok-bg); color:var(--ok); }
  .cal-pill.未承認{ background:var(--warn-bg); color:var(--warn); }
  .cal-pill.more{ background:var(--bg); color:var(--muted); text-align:center; }
  .cal-legend{
    display:flex;
    gap:14px;
    margin-top:12px;
    font-size:11.5px;
    color:var(--muted);
  }
  .cal-legend-item{ display:flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot-ok{ background:var(--ok); }
  .dot-warn{ background:var(--warn); }
  #cal-detail-list .det-row{
    padding:8px 0;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  #cal-detail-list .det-row:first-child{ border-top:none; }
</style>
</head>
<body>

<header>
  <h1>休暇届 承認</h1>
  <p>日本セイフティー株式会社　東北機材センター</p>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="list">承認・履歴</button>
  <button class="tab-btn" data-tab="calendar">カレンダー</button>
</div>

<main>

  <!-- ===== 承認・履歴 タブ ===== -->
  <section id="view-list" class="view active">
    <div class="card">
      <div class="filter-row">
        <select id="f-filter-name">
          <option value="">全員</option>
        </select>
        <label class="switch">
          <input type="checkbox" id="f-filter-pending" checked>
          未承認のみ
        </label>
      </div>
    </div>
    <div id="list-wrap">
      <div class="loading">読み込み中...</div>
    </div>
  </section>

  <!-- ===== カレンダー タブ ===== -->
  <section id="view-calendar" class="view">
    <div class="card">
      <div class="field" style="margin-bottom:4px;">
        <label>高野・平間の休み登録<span class="hint">申請・承認の手続きなしで、直接カレンダーに反映されます</span></label>
      </div>
      <div class="field">
        <div class="cat-grid" id="mgr-name-grid"></div>
      </div>
      <div class="field">
        <label>取得区分<span class="hint">全日・半休・時間休を選択</span></label>
        <div class="cat-grid" id="mgr-subtype-grid"></div>
      </div>

      <div class="field" id="mgr-block-day">
        <label>期間<span class="hint">複数日にわたる場合</span></label>
        <div class="sub-block">
          <div class="row2">
            <div>
              <label style="font-weight:400;font-size:12px;">開始日</label>
              <input type="date" id="mgr-datefrom">
            </div>
            <div>
              <label style="font-weight:400;font-size:12px;">終了日</label>
              <input type="date" id="mgr-dateto">
            </div>
          </div>
          <div class="calc-note" id="mgr-days-note"></div>
        </div>
      </div>

      <div class="field" id="mgr-block-halfday" style="display:none;">
        <label>取得日</label>
        <div class="sub-block">
          <input type="date" id="mgr-halfday">
        </div>
      </div>

      <div class="field" id="mgr-block-time" style="display:none;">
        <label>日時<span class="hint">時間単位の場合</span></label>
        <div class="sub-block">
          <div class="row2">
            <div>
              <label style="font-weight:400;font-size:12px;">開始</label>
              <input type="datetime-local" id="mgr-dtfrom">
            </div>
            <div>
              <label style="font-weight:400;font-size:12px;">終了</label>
              <input type="datetime-local" id="mgr-dtto">
            </div>
          </div>
          <div class="calc-note" id="mgr-hours-note"></div>
        </div>
      </div>

      <div class="field">
        <label>事由・備考<span class="hint">任意</span></label>
        <input type="text" id="mgr-reason" placeholder="（任意）">
      </div>
      <button class="submit-btn" id="mgr-submit">休みを登録</button>
      <div class="msg" id="mgr-msg"></div>
    </div>
    <div class="card" id="mgr-list-card" style="display:none;">
      <div style="font-weight:700; color:var(--blue-dark); margin-bottom:4px;">登録済みの休み</div>
      <div id="mgr-list"></div>
    </div>
    <div class="card">
      <div class="cal-nav">
        <button class="cal-nav-btn" id="cal-prev">‹</button>
        <div class="cal-title" id="cal-title"></div>
        <button class="cal-nav-btn" id="cal-next">›</button>
      </div>
      <div class="cal-weekdays">
        <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">
        <span class="cal-legend-item"><span class="dot dot-ok"></span>承認済み</span>
        <span class="cal-legend-item"><span class="dot dot-warn"></span>未承認</span>
      </div>
    </div>
    <div class="card" id="cal-detail" style="display:none;">
      <div id="cal-detail-title" style="font-weight:700; color:var(--blue-dark); margin-bottom:4px;"></div>
      <div id="cal-detail-list"></div>
    </div>
  </section>

</main>

<div id="confirm-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center; padding:20px;">
  <div style="background:#fff; border-radius:14px; padding:22px 20px; max-width:340px; width:100%; box-shadow:0 8px 30px rgba(0,0,0,.25);">
    <div id="confirm-message" style="font-size:15px; font-weight:700; margin-bottom:18px; line-height:1.5;"></div>
    <div style="display:flex; gap:10px;">
      <button id="confirm-no" style="flex:1; padding:11px; border:1px solid #DCE1DD; border-radius:9px; background:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit;">キャンセル</button>
      <button id="confirm-yes" style="flex:1; padding:11px; border:none; border-radius:9px; background:#0A5295; color:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit;">OK</button>
    </div>
  </div>
</div>

<script>
// ▼▼▼ デプロイ後、Apps ScriptのウェブアプリURLに置き換えてください ▼▼▼
const GAS_URL = "https://script.google.com/macros/s/AKfycbxeKNRgxoeSAtl_CCSZLjl_r8nd6mY4WLvQQ939lQLJzcVMTDHfuaV7A822x0kvO8t3/exec";
// ▲▲▲

let staffList = [];
let requestsCache = [];
let managersList = [];
let selectedManagerName = '';
const SUBTYPES = ['全日','午前半休','午後半休','時間休'];
let mgrSubtype = '全日';

/* ---------- タブ切替 ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
    loadData();
  });
});

/* ---------- 一覧・承認 ---------- */
async function loadData(){
  const wrap = document.getElementById('list-wrap');
  try{
    const res = await fetch(GAS_URL + '?action=list');
    const data = await res.json();
    if (!data.ok){ wrap.innerHTML = '<div class="empty">読み込みエラー: '+(data.error||'')+'</div>'; return; }

    staffList = data.staff || [];
    requestsCache = data.requests || [];
    managersList = data.managers || [];
    fillNameSelects();
    buildManagerGrid();
    renderList();
    renderCalendar();
    renderManagerHolidays();
  } catch(err){
    wrap.innerHTML = '<div class="empty">通信エラーが発生しました。</div>';
  }
}

function fillNameSelects(){
  const filterSel = document.getElementById('f-filter-name');
  if (filterSel.options.length <= 1){
    staffList.forEach(n=>{
      const o = document.createElement('option'); o.value = n; o.textContent = n;
      filterSel.appendChild(o);
    });
  }
}

document.getElementById('f-filter-name').addEventListener('change', renderList);
document.getElementById('f-filter-pending').addEventListener('change', renderList);

function renderList(){
  const wrap = document.getElementById('list-wrap');
  const nameFilter = document.getElementById('f-filter-name').value;
  const pendingOnly = document.getElementById('f-filter-pending').checked;

  let items = requestsCache.slice();
  if (nameFilter) items = items.filter(r=>r['氏名']===nameFilter);
  if (pendingOnly) items = items.filter(r=>r['承認状況']==='未承認');

  if (items.length === 0){
    wrap.innerHTML = '<div class="empty">該当する申請はありません。</div>';
    return;
  }

  wrap.innerHTML = items.map(r=>{
    const status = r['承認状況'] || '未承認';
    const catLabel = (r['区分']||'').replace(/^\d+\./,'').trim() + (r['区分詳細'] ? '（'+r['区分詳細']+'）' : '');
    let periodLine = '';
    if (r['期間開始日'] && r['期間終了日']){
      periodLine = fmtDate(r['期間開始日']) + ' 〜 ' + fmtDate(r['期間終了日']) + (r['日数'] ? '　(' + r['日数'] + '日間)' : '');
    } else if (r['開始日時'] && r['終了日時']){
      periodLine = fmtDateTime(r['開始日時']) + ' 〜 ' + fmtDateTime(r['終了日時']) + (r['時間'] ? '　(' + r['時間'] + ')' : '');
    }
    return `
    <div class="req-card st-${status}">
      <div class="req-top">
        <div>
          <div class="req-name">${esc(r['氏名'])}</div>
          <div class="req-cat">${esc(catLabel)}</div>
        </div>
        <span class="badge ${status}">${status}</span>
      </div>
      <div class="req-meta">
        ${periodLine ? '<div>'+esc(periodLine)+'</div>' : ''}
        <div><span class="k">申請日時:</span> ${esc(r['申請日時']||'')}</div>
      </div>
      ${r['事由'] ? '<div class="req-reason">'+esc(r['事由'])+'</div>' : ''}
      ${status==='未承認' ? `
      <div class="req-actions">
        <button class="btn-approve" onclick="doApprove('${r['ID']}')">承認する</button>
        <button class="btn-reject" onclick="doReject('${r['ID']}')">却下する</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

function fmtDate(v){ return String(v==null?'':v).replace(/ 00:00$/,''); }
function fmtDateTime(v){ return v; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtTime(v){
  const m = String(v).match(/(\d{1,2}):(\d{2})/);
  return m ? m[1] + ':' + m[2] : '';
}

/* ---------- 高野・平間の休み登録（申請・承認を経ない直接登録） ---------- */
function buildManagerGrid(){
  const grid = document.getElementById('mgr-name-grid');
  if (grid.children.length > 0) return; // 一度だけ生成
  managersList.forEach(name=>{
    const div = document.createElement('div');
    div.className = 'cat-opt';
    div.textContent = name;
    div.dataset.name = name;
    div.addEventListener('click', ()=>{
      selectedManagerName = name;
      document.querySelectorAll('#mgr-name-grid .cat-opt').forEach(el=>{
        el.classList.toggle('selected', el.dataset.name === name);
      });
    });
    grid.appendChild(div);
  });
}

/* ---------- 取得区分グリッド生成（有給休暇と同じ：全日・半休・時間休） ---------- */
const mgrSubtypeGrid = document.getElementById('mgr-subtype-grid');
SUBTYPES.forEach(sub=>{
  const div = document.createElement('div');
  div.className = 'cat-opt';
  div.textContent = sub;
  div.dataset.sub = sub;
  div.addEventListener('click', ()=>selectMgrSubtype(sub));
  mgrSubtypeGrid.appendChild(div);
});

function selectMgrSubtype(sub){
  mgrSubtype = sub;
  document.querySelectorAll('#mgr-subtype-grid .cat-opt').forEach(el=>{
    el.classList.toggle('selected', el.dataset.sub === sub);
  });
  document.getElementById('mgr-block-day').style.display = (sub === '全日') ? 'block' : 'none';
  document.getElementById('mgr-block-halfday').style.display = (sub === '午前半休' || sub === '午後半休') ? 'block' : 'none';
  document.getElementById('mgr-block-time').style.display = (sub === '時間休') ? 'block' : 'none';
}

function calcMgrDays(){
  const from = document.getElementById('mgr-datefrom').value;
  const to = document.getElementById('mgr-dateto').value;
  const note = document.getElementById('mgr-days-note');
  if (!from || !to) { note.textContent = ''; return; }
  const d1 = new Date(from), d2 = new Date(to);
  const diff = Math.round((d2-d1)/86400000) + 1;
  note.textContent = diff >= 1 ? diff + ' 日間' : '終了日は開始日以降にしてください';
}
document.getElementById('mgr-datefrom').addEventListener('change', calcMgrDays);
document.getElementById('mgr-dateto').addEventListener('change', calcMgrDays);

function calcMgrHours(){
  const from = document.getElementById('mgr-dtfrom').value;
  const to = document.getElementById('mgr-dtto').value;
  const note = document.getElementById('mgr-hours-note');
  if (!from || !to) { note.textContent = ''; return; }
  const d1 = new Date(from), d2 = new Date(to);
  const diffMin = Math.round((d2-d1)/60000);
  if (diffMin < 0) { note.textContent = '終了は開始より後にしてください'; return; }
  const h = Math.floor(diffMin/60), m = diffMin % 60;
  note.textContent = h + ' 時間 ' + m + ' 分';
}
document.getElementById('mgr-dtfrom').addEventListener('change', calcMgrHours);
document.getElementById('mgr-dtto').addEventListener('change', calcMgrHours);

document.getElementById('mgr-submit').addEventListener('click', async ()=>{
  const msg = document.getElementById('mgr-msg');
  msg.className = 'msg';

  if (!selectedManagerName){ showMgrMsg(msg,'氏名を選択してください', false); return; }

  let dateFrom = document.getElementById('mgr-datefrom').value;
  let dateTo = document.getElementById('mgr-dateto').value;
  let dtFrom = document.getElementById('mgr-dtfrom').value;
  let dtTo = document.getElementById('mgr-dtto').value;
  let categoryDetail = '';

  if (mgrSubtype === '午前半休' || mgrSubtype === '午後半休'){
    const day = document.getElementById('mgr-halfday').value;
    if (!day){ showMgrMsg(msg,'取得日を入力してください', false); return; }
    dateFrom = day; dateTo = day;
    dtFrom = ''; dtTo = '';
    categoryDetail = mgrSubtype;
  } else if (mgrSubtype === '時間休'){
    dateFrom = ''; dateTo = '';
    categoryDetail = mgrSubtype;
    if (!dtFrom || !dtTo){ showMgrMsg(msg,'開始・終了の日時を入力してください', false); return; }
  } else {
    dtFrom = ''; dtTo = '';
    categoryDetail = '';
    if (!dateFrom || !dateTo){ showMgrMsg(msg,'開始日と終了日を入力してください', false); return; }
    if (new Date(dateTo) < new Date(dateFrom)){ showMgrMsg(msg,'終了日は開始日以降にしてください', false); return; }
  }

  let days = '';
  if (mgrSubtype === '午前半休' || mgrSubtype === '午後半休'){
    days = 0.5;
  } else if (dateFrom && dateTo){
    const diff = Math.round((new Date(dateTo)-new Date(dateFrom))/86400000)+1;
    days = diff >= 1 ? diff : '';
  }
  let hours = '';
  if (dtFrom && dtTo){
    const diffMin = Math.round((new Date(dtTo)-new Date(dtFrom))/60000);
    if (diffMin >= 0) hours = Math.floor(diffMin/60)+':'+String(diffMin%60).padStart(2,'0');
  }

  const payload = {
    name: selectedManagerName,
    categoryDetail: categoryDetail,
    dateFrom: dateFrom, dateTo: dateTo, days: days,
    dtFrom: dtFrom, dtTo: dtTo, hours: hours,
    reason: document.getElementById('mgr-reason').value
  };

  const btn = document.getElementById('mgr-submit');
  btn.disabled = true; btn.textContent = '登録中...';
  try{
    const res = await postAction('adminAddHoliday', payload);
    if (res.ok){
      showMgrMsg(msg, '休みを登録しました。', true);
      resetMgrForm();
      await loadData();
    } else {
      showMgrMsg(msg, 'エラー: ' + (res.error||'登録に失敗しました'), false);
    }
  } catch(err){
    showMgrMsg(msg, '通信エラーが発生しました。時間をおいて再度お試しください。', false);
  } finally {
    btn.disabled = false; btn.textContent = '休みを登録';
  }
});

function resetMgrForm(){
  selectedManagerName = '';
  mgrSubtype = '全日';
  document.querySelectorAll('#mgr-name-grid .cat-opt').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('#mgr-subtype-grid .cat-opt').forEach(el=>el.classList.remove('selected'));
  document.getElementById('mgr-block-day').style.display = 'block';
  document.getElementById('mgr-block-halfday').style.display = 'none';
  document.getElementById('mgr-block-time').style.display = 'none';
  ['mgr-datefrom','mgr-dateto','mgr-dtfrom','mgr-dtto','mgr-halfday','mgr-reason'].forEach(id=>{
    document.getElementById(id).value = '';
  });
  document.getElementById('mgr-days-note').textContent = '';
  document.getElementById('mgr-hours-note').textContent = '';
}

function showMgrMsg(el, text, ok){
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'bad');
  el.style.display = 'block';
}

function renderManagerHolidays(){
  const card = document.getElementById('mgr-list-card');
  const list = document.getElementById('mgr-list');
  const mine = requestsCache.filter(r => managersList.indexOf(r['氏名']) !== -1);

  if (mine.length === 0){ card.style.display = 'none'; return; }

  card.style.display = 'block';
  list.innerHTML = mine.map(r=>{
    const detail = r['区分詳細'] ? '（'+r['区分詳細']+'）' : '';
    let period = '';
    if (r['期間開始日'] && r['期間終了日']){
      const d1 = fmtDate(r['期間開始日']);
      const d2 = fmtDate(r['期間終了日']);
      period = (d1 === d2) ? d1 : (d1 + ' 〜 ' + d2);
      if (r['日数']) period += '　(' + r['日数'] + '日間)';
    } else if (r['開始日時'] && r['終了日時']){
      period = r['開始日時'] + ' 〜 ' + r['終了日時'] + (r['時間'] ? '　(' + r['時間'] + ')' : '');
    }
    return '<div class="mgr-row">'
      + '<div class="mgr-info"><b>'+esc(r['氏名'])+esc(detail)+'</b>'
      + (period ? '<div class="mgr-period">'+esc(period)+(r['事由']?'　'+esc(r['事由']):'')+'</div>' : '')
      + '</div>'
      + '<button class="mgr-del" data-id="'+esc(r['ID'])+'">削除</button>'
      + '</div>';
  }).join('');

  list.querySelectorAll('.mgr-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      showConfirm('この休みの登録を削除しますか？', async ()=>{
        btn.disabled = true; btn.textContent = '削除中...';
        try{
          const res = await postAction('adminDeleteHoliday', { id: btn.dataset.id });
          if (res.ok){
            await loadData();
          } else {
            alert('エラー: ' + (res.error || '削除に失敗しました'));
            btn.disabled = false; btn.textContent = '削除';
          }
        } catch(err){
          alert('通信エラーが発生しました。時間をおいて再度お試しください。');
          btn.disabled = false; btn.textContent = '削除';
        }
      });
    });
  });
}

function doReject(id){

function showConfirm(message, onYes){
  const modal = document.getElementById('confirm-modal');
  document.getElementById('confirm-message').textContent = message;
  modal.style.display = 'flex';
  const yesBtn = document.getElementById('confirm-yes');
  const noBtn = document.getElementById('confirm-no');
  const cleanup = () => {
    modal.style.display = 'none';
    yesBtn.onclick = null;
    noBtn.onclick = null;
  };
  yesBtn.onclick = () => { cleanup(); onYes(); };
  noBtn.onclick = () => { cleanup(); };
}

async function postAction(action, payload){
  const res = await fetch(GAS_URL + '?action=' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORSプリフライト回避
    body: JSON.stringify(payload)
  });
  return res.json();
}

/* ---------- カレンダー ---------- */
let calCursor = new Date();
calCursor.setDate(1);
calCursor.setHours(0,0,0,0);

function toDateKey(v){
  if (!v) return '';
  const m = String(v).match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (!m) return '';
  return m[1] + '-' + String(m[2]).padStart(2,'0') + '-' + String(m[3]).padStart(2,'0');
}

function getRequestsForDate(dateKey){
  return requestsCache.filter(r=>{
    const status = r['承認状況'] || '未承認';
    if (status === '却下') return false;
    if (r['期間開始日'] && r['期間終了日']){
      const from = toDateKey(r['期間開始日']), to = toDateKey(r['期間終了日']);
      return from && to && dateKey >= from && dateKey <= to;
    } else if (r['開始日時']){
      return toDateKey(r['開始日時']) === dateKey;
    }
    return false;
  });
}

function renderCalendar(){
  const year = calCursor.getFullYear();
  const month = calCursor.getMonth();
  document.getElementById('cal-title').textContent = year + '年 ' + (month+1) + '月';

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayKey = toDateKey(new Date().getFullYear() + '-' + (new Date().getMonth()+1) + '-' + new Date().getDate());

  let html = '';
  for (let i=0;i<firstDow;i++) html += '<div class="cal-cell empty"></div>';
  for (let d=1; d<=daysInMonth; d++){
    const dateKey = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const items = getRequestsForDate(dateKey);
    const isToday = dateKey === todayKey;
    let pillsHtml = items.slice(0,3).map(r=>{
      const st = r['承認状況']||'未承認';
      return '<div class="cal-pill '+st+'">'+esc(r['氏名'])+'</div>';
    }).join('');
    if (items.length > 3) pillsHtml += '<div class="cal-pill more">+'+(items.length-3)+'</div>';
    html += '<div class="cal-cell'+(isToday?' today':'')+'" onclick="showDayDetail(\''+dateKey+'\')">'
          + '<div class="cal-daynum">'+d+'</div>'
          + pillsHtml
          + '</div>';
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function showDayDetail(dateKey){
  const items = getRequestsForDate(dateKey);
  const panel = document.getElementById('cal-detail');
  const title = document.getElementById('cal-detail-title');
  const list = document.getElementById('cal-detail-list');
  const parts = dateKey.split('-');
  title.textContent = parts[0]+'年'+parseInt(parts[1],10)+'月'+parseInt(parts[2],10)+'日の休暇・予定';

  if (items.length === 0){
    list.innerHTML = '<div class="empty" style="padding:10px 0;">この日の申請はありません。</div>';
  } else {
    list.innerHTML = items.map(r=>{
      const status = r['承認状況']||'未承認';
      const catLabel = (r['区分']||'').replace(/^\d+\./,'').trim() + (r['区分詳細'] ? '（'+r['区分詳細']+'）' : '');
      let timeLabel = '';
      if (r['開始日時'] && r['終了日時']){
        timeLabel = '　' + fmtTime(r['開始日時']) + '〜' + fmtTime(r['終了日時']);
      }
      return '<div class="det-row"><b>'+esc(r['氏名'])+'</b>　'+esc(catLabel)+esc(timeLabel)
        + ' <span class="badge '+status+'" style="margin-left:6px;">'+status+'</span></div>';
    }).join('');
  }
  panel.style.display = 'block';
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

document.getElementById('cal-prev').addEventListener('click', ()=>{
  calCursor.setMonth(calCursor.getMonth()-1);
  document.getElementById('cal-detail').style.display = 'none';
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', ()=>{
  calCursor.setMonth(calCursor.getMonth()+1);
  document.getElementById('cal-detail').style.display = 'none';
  renderCalendar();
});

/* ---------- アイコンの通知バッジ（未承認件数） ---------- */
async function updateBadge(){
  try{
    const res = await fetch(GAS_URL + '?action=pendingCount');
    const data = await res.json();
    if (!data.ok) return;
    if ('setAppBadge' in navigator){
      if (data.count > 0){
        navigator.setAppBadge(data.count).catch(()=>{});
      } else {
        navigator.clearAppBadge().catch(()=>{});
      }
    }
    document.title = (data.count > 0 ? '(' + data.count + ') ' : '') + '休暇届 承認';
  } catch(err){
    // 通信エラーはバッジ更新のみに影響
  }
}

/* 初期表示 */
loadData();
renderCalendar();
updateBadge();
setInterval(updateBadge, 30000);
